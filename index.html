/* ============================================================
   PRESENÇA & PONTO (registro diário por obra + custos)
   ============================================================ */
const STATUS_PRESENCA = {
  presente:          {label:'Presente',          color:'green',  abrev:'P'},
  meio:              {label:'Meio período',       color:'gold',   abrev:'M'},
  falta:             {label:'Falta',              color:'red',    abrev:'F'},
  falta_justificada: {label:'Falta justificada',  color:'blue',   abrev:'FJ'},
  folga:             {label:'Folga/Feriado',      color:'muted',  abrev:'FO'},
};
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nomeDiaSemana(iso, abrev){
  const dias = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
  const abrevs = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const d = new Date(iso+'T12:00:00'); // meio-dia evita a data "voltar" um dia por causa do fuso horário
  const idx = d.getDay();
  return abrev ? abrevs[idx] : dias[idx];
}
function addDaysISO(dataISO, n){
  const d = new Date(dataISO+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10);
}
function startOfWeekISO(dataISO){
  const d = new Date(dataISO+'T00:00:00');
  const day = d.getDay();
  const diff = (day===0?-6:1-day);
  d.setDate(d.getDate()+diff);
  return d.toISOString().slice(0,10);
}
function daysInMonthISO(mesYYYYMM){
  const [y,m] = mesYYYYMM.split('-').map(Number);
  return new Date(y,m,0).getDate();
}
function pessoasNaObra(obraId){
  const ids = new Set(DB.rhAlocacoes.filter(a=>a.obraId===obraId).map(a=>a.pessoaId));
  return DB.rhPessoas.filter(p=>ids.has(p.id));
}
function getPresenca(obraId,pessoaId,data){
  return DB.presencas.find(x=>x.obraId===obraId && x.pessoaId===pessoaId && x.data===data);
}
function horaToMin(hhmm){
  if(!hhmm || !/^\d{1,2}:\d{2}$/.test(hhmm)) return null;
  const [h,m] = hhmm.split(':').map(Number);
  return h*60+m;
}
function calcHorasFromHorarios(entrada,saidaAlmoco,voltaAlmoco,saida){
  const e = horaToMin(entrada), s = horaToMin(saida);
  if(e==null || s==null) return null;
  let totalMin = s - e; if(totalMin < 0) totalMin += 24*60;
  const sa = horaToMin(saidaAlmoco), va = horaToMin(voltaAlmoco);
  if(sa!=null && va!=null){ let almoco = va - sa; if(almoco<0) almoco += 24*60; totalMin -= almoco; }
  return Math.max(0, Math.round((totalMin/60)*100)/100);
}
function calcCustoPresenca(pessoa,status,horas,horasExtras){
  if(!pessoa || status==='falta' || status==='folga' || !status) return {normal:0, extra:0, total:0};
  const jornada = Number(pessoa.jornadaDiaria)||8;
  const tipo = pessoa.tipoContratacao || 'dia';
  if(tipo==='empreita'){
    // Empreita: valor fechado combinado por um serviço, não por dia/hora — o custo
    // diário de presença é 0. O pagamento é lançado manualmente em "Pagamentos".
    return {normal:0, extra:0, total:0};
  }
  const diaria = tipo==='dia' ? (Number(pessoa.custoDia)||0) : 0;
  const valorHora = tipo==='hora' ? (Number(pessoa.custoHora)||0) : (diaria ? diaria/jornada : 0);
  let normal;
  if(status==='meio') normal = diaria ? diaria/2 : valorHora*(Number(horas)||jornada/2);
  else normal = diaria ? diaria : valorHora*(Number(horas)||jornada); // presente ou falta_justificada (remunerada)
  const extra = (Number(horasExtras)||0) * valorHora * 1.5;
  return {normal, extra, total: normal+extra};
}
/* patch: {status, horaEntrada, horaSaidaAlmoco, horaVoltaAlmoco, horaSaida, horas, obs} — campos ausentes mantêm o valor já salvo */
function setPresenca(obraId,pessoaId,data,patch){
  const pessoa = DB.rhPessoas.find(p=>p.id===pessoaId);
  const obra = DB.obras.find(o=>o.id===obraId);
  const recebeAlim = !pessoa || pessoa.recebeAlimentacao!==false;
  let rec = getPresenca(obraId,pessoaId,data);
  if(!rec){ rec = {id:uid(), obraId, pessoaId, data, status:'', horaEntrada:'', horaSaidaAlmoco:'', horaVoltaAlmoco:'', horaSaida:'', horas:'', horasExtras:0, custoNormal:0, custoExtra:0, almoco:false, custoAlmoco:0, custo:0, obs:''}; DB.presencas.push(rec); }
  const patchDefiniuAlmoco = patch && Object.prototype.hasOwnProperty.call(patch,'almoco');
  Object.keys(patch||{}).forEach(k=>{ if(patch[k]!==undefined) rec[k]=patch[k]; });
  if(patch && patch.status!==undefined && !patchDefiniuAlmoco){
    rec.almoco = (patch.status==='presente' || patch.status==='meio'); // padrão: fornece almoço quando há presença
  }
  if(!recebeAlim) rec.almoco = false; // pessoa não vinculada ao benefício de alimentação
  const jornada = Number(pessoa&&pessoa.jornadaDiaria)||8;
  const horasCalc = calcHorasFromHorarios(rec.horaEntrada, rec.horaSaidaAlmoco, rec.horaVoltaAlmoco, rec.horaSaida);
  const horasFinal = horasCalc!=null ? horasCalc : (rec.horas!=='' ? Number(rec.horas) : '');
  rec.horas = horasFinal;
  rec.horasExtras = (horasFinal!=='' && (rec.status==='presente')) ? Math.max(0, Math.round((horasFinal-jornada)*100)/100) : 0;
  const custoTrab = calcCustoPresenca(pessoa, rec.status, horasFinal, rec.horasExtras);
  const valorAlmoco = Number(obra&&obra.custoAlmoco)||0;
  rec.custoAlmoco = (rec.almoco && recebeAlim) ? valorAlmoco : 0;
  rec.custoNormal = custoTrab.normal; rec.custoExtra = custoTrab.extra;
  rec.custo = custoTrab.total + rec.custoAlmoco;
  saveDB();
  return rec;
}

      ${recebeAlim ? `

      <div class="hint" style="padding:10px 0;">🚫 Esta pessoa não está vinculada ao benefício de alimentação (configurável em RH &amp; Equipe → Editar pessoa). O custo de alimentação não será somado a ela.</div>`}

}
function savePontoDetalhe(e,pessoaId,data){
  e.preventDefault();
  const fd = new FormData(e.target);
  const f = Object.fromEntries(fd.entries());
  f.almoco = !!fd.get('almoco'); // checkbox: presente na FormData somente se marcado
  if(!f.status){ removePresenca(STATE.obraId,pessoaId,data); closeModal(); toast('Registro removido.'); renderPage(); return; }
  setPresenca(STATE.obraId,pessoaId,data,f);
  closeModal(); toast('Ponto registrado.'); renderPage();
}
function limparPontoDetalhe(pessoaId,data){
  removePresenca(STATE.obraId,pessoaId,data);
  closeModal(); toast('Registro removido.'); renderPage();
}
function marcarStatusRapido(pessoaId,data,status){
  const rec = getPresenca(STATE.obraId,pessoaId,data);
  if(rec && rec.status===status){ removePresenca(STATE.obraId,pessoaId,data); renderPage(); return; }
  setPresenca(STATE.obraId,pessoaId,data,{status});
  renderPage();
}
function renderPresencaSemana(){
  const monday = startOfWeekISO(STATE.presenca.data);
  const dias = [0,1,2,3,4,5,6].map(i=>addDaysISO(monday,i));
  const nomesDia = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  const pessoas = pessoasNaObra(STATE.obraId);
  const rows = pessoas.map(p=>{
    let totalSemana = 0;
    const cells = dias.map(d=>{
      const rec = getPresenca(STATE.obraId,p.id,d);
      totalSemana += rec?Number(rec.custo)||0:0;
      const cfg = rec && STATUS_PRESENCA[rec.status];
      return `<td style="text-align:center;cursor:pointer;" title="${cfg?cfg.label:'Sem registro'} — clique para editar" onclick="setPresencaData('${d}');setPresencaView('dia')">
        ${cfg?`<span class="badge badge-${cfg.color}">${cfg.abrev}</span>`:'<span style="color:var(--muted2);">—</span>'}
      </td>`;
    }).join('');
    return `<tr><td><b>${esc(p.nome)}</b></td>${cells}<td><b>${fmtMoney(totalSemana)}</b></td></tr>`;
  }).join('');
  const totalGeral = pessoas.reduce((s,p)=>s+dias.reduce((s2,d)=>{const rec=getPresenca(STATE.obraId,p.id,d); return s2+(rec?Number(rec.custo)||0:0);},0),0);
  return `<div class="card">
    <div class="field-row" style="align-items:flex-end;">
      <div class="field" style="max-width:200px;"><label>Qualquer dia da semana</label><input type="date" value="${STATE.presenca.data}" onchange="setPresencaData(this.value)"></div>
      <div style="display:flex;gap:8px;margin-bottom:14px;">
        <button class="btn btn-sm" onclick="setPresencaData('${addDaysISO(monday,-7)}')">← Semana anterior</button>
        <button class="btn btn-sm" onclick="setPresencaData('${addDaysISO(monday,7)}')">Semana seguinte →</button>
      </div>
    </div>
    <p class="hint">Semana de ${fmtDate(monday)} a ${fmtDate(dias[6])}. Clique em um dia para editar o registro.</p>
    ${pessoas.length ? `<div class="table-wrap"><table>
      <thead><tr><th>Pessoa</th>${nomesDia.map((n,i)=>`<th>${n}<br><span style="font-weight:400;font-size:11px;">${fmtDate(dias[i]).slice(0,5)}</span></th>`).join('')}<th>Total semana</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
      <div class="total-line"><span>Total geral da semana</span><span>${fmtMoney(totalGeral)}</span></div>`
      : `<div class="empty-state"><div class="big">👷</div><p>Nenhuma pessoa alocada nesta obra ainda.</p></div>`}
  </div>`;
}
function renderPresencaMes(){
  const mes = STATE.presenca.mes; // YYYY-MM
  const pessoas = pessoasNaObra(STATE.obraId);
  const registrosDoMes = DB.presencas.filter(x=>x.obraId===STATE.obraId && x.data.slice(0,7)===mes);
  const rows = pessoas.map(p=>{
    const regs = registrosDoMes.filter(r=>r.pessoaId===p.id);
    const cont = {presente:0,meio:0,falta:0,falta_justificada:0,folga:0};
    let custo = 0, custoExtra = 0, horasExtras = 0, custoAlimentacao = 0, diasAlmoco = 0;
    regs.forEach(r=>{ cont[r.status]=(cont[r.status]||0)+1; custo += Number(r.custo)||0; custoExtra += Number(r.custoExtra)||0; horasExtras += Number(r.horasExtras)||0; custoAlimentacao += Number(r.custoAlmoco)||0; if(r.almoco) diasAlmoco++; });
    return `<tr>
      <td><b>${esc(p.nome)}</b><br><span style="font-size:11px;color:var(--muted2);">${esc(p.funcao||'—')}</span></td>
      <td><span class="badge badge-green">${cont.presente}</span></td>
      <td><span class="badge badge-gold">${cont.meio}</span></td>
      <td><span class="badge badge-red">${cont.falta}</span></td>
      <td><span class="badge badge-blue">${cont.falta_justificada}</span></td>
      <td><span class="badge badge-muted">${cont.folga}</span></td>
      <td>${horasExtras>0?`${Math.round(horasExtras*100)/100}h <span class="hint" style="display:inline;">(${fmtMoney(custoExtra)})</span>`:'—'}</td>
      <td>${diasAlmoco>0?`${diasAlmoco}x <span class="hint" style="display:inline;">(${fmtMoney(custoAlimentacao)})</span>`:'—'}</td>
      <td><b>${fmtMoney(custo)}</b></td>
    </tr>`;
  }).join('');
  const totalMes = registrosDoMes.reduce((s,r)=>s+(Number(r.custo)||0),0);
  const totalAlimentacaoMes = registrosDoMes.reduce((s,r)=>s+(Number(r.custoAlmoco)||0),0);
  return `<div class="card">
    <div class="field-row" style="align-items:flex-end;">
      <div class="field" style="max-width:200px;"><label>Mês</label><input type="month" value="${mes}" onchange="setPresencaMes(this.value)"></div>
      <button class="btn btn-sm" style="margin-bottom:14px;" onclick="printFolhaPonto()">🖨️ Imprimir Folha de Ponto</button>
    </div>
    ${pessoas.length ? `<div class="table-wrap"><table>
      <thead><tr><th>Pessoa</th><th>Presenças</th><th>Meio período</th><th>Faltas</th><th>Faltas just.</th><th>Folgas</th><th>Horas extras</th><th>Almoços</th><th>Custo no mês</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
      <div class="total-line"><span>Alimentação no mês</span><span>${fmtMoney(totalAlimentacaoMes)}</span></div>
      <div class="total-line" style="font-size:15px;"><span>Custo total de mão de obra + alimentação no mês</span><span>${fmtMoney(totalMes)}</span></div>`
      : `<div class="empty-state"><div class="big">👷</div><p>Nenhuma pessoa alocada nesta obra ainda.</p></div>`}
  </div>`;
}
function marcarTodosPresentes(data){
  pessoasNaObra(STATE.obraId).forEach(p=>{
    setPresenca(STATE.obraId,p.id,data,{status:'presente'});
  });
  toast('Todos marcados como presentes.'); renderPage();
}
function printFolhaPonto(){
  const o = currentObra();
  const mes = STATE.presenca.mes;
  const nDias = daysInMonthISO(mes);
  const registrosMes = DB.presencas.filter(x=>x.obraId===o.id && x.data.slice(0,7)===mes);
  const pessoasComRegistro = new Set(registrosMes.map(r=>r.pessoaId));
  DB.rhAlocacoes.filter(a=>a.obraId===o.id && !a.dataFim).forEach(a=>pessoasComRegistro.add(a.pessoaId));
  const pessoas = DB.rhPessoas.filter(p=>pessoasComRegistro.has(p.id));
  const [ano,mesNum] = mes.split('-');
  const secoes = pessoas.map(p=>{
    let linhas = '';
    let totalHoras = 0, totalCusto = 0, totalAlimentacao = 0;
    for(let d=1; d<=nDias; d++){
      const dataISOStr = mes+'-'+String(d).padStart(2,'0');
      const rec = registrosMes.find(r=>r.pessoaId===p.id && r.data===dataISOStr);
      const cfg = rec && STATUS_PRESENCA[rec.status];
      const diaSemanaIdx = new Date(dataISOStr+'T12:00:00').getDay();
      const fimDeSemana = diaSemanaIdx===0 || diaSemanaIdx===6;
      totalHoras += rec?Number(rec.horas)||0:0;
      totalCusto += rec?Number(rec.custo)||0:0;
      totalAlimentacao += rec?Number(rec.custoAlmoco)||0:0;
      linhas += `<tr${fimDeSemana?' style="background:#f6f6f6;"':''}>
        <td>${String(d).padStart(2,'0')}/${mesNum}</td>
        <td>${nomeDiaSemana(dataISOStr,true)}</td>
        <td>${cfg?cfg.label:'—'}</td>
        <td>${rec&&rec.horaEntrada?rec.horaEntrada:'—'}</td>
        <td>${rec&&rec.horaSaidaAlmoco?rec.horaSaidaAlmoco:'—'}</td>
        <td>${rec&&rec.horaVoltaAlmoco?rec.horaVoltaAlmoco:'—'}</td>
        <td>${rec&&rec.horaSaida?rec.horaSaida:'—'}</td>
        <td>${rec&&rec.horas!==''&&rec.horas!=null?rec.horas+'h':'—'}</td>
        <td>${rec?(rec.almoco?'Sim':'Não'):'—'}</td>
      </tr>`;
    }
    return `<div style="page-break-inside:avoid;margin-bottom:26px;">
      <h2>${esc(p.nome)} — ${esc(p.funcao||'')}</h2>
      <table><thead><tr><th>Data</th><th>Dia</th><th>Status</th><th>Entrada</th><th>Saída almoço</th><th>Volta almoço</th><th>Saída</th><th>Horas</th><th>Almoço</th></tr></thead>
      <tbody>${linhas}</tbody></table>
      <p class="tot">Total de horas no mês: ${Math.round(totalHoras*100)/100}h &nbsp;|&nbsp; Alimentação: ${fmtMoney(totalAlimentacao)} &nbsp;|&nbsp; Custo total: ${fmtMoney(totalCusto)}</p>
      <div style="display:flex;gap:60px;margin-top:26px;">
        <div style="flex:1;border-top:1px solid #333;padding-top:6px;text-align:center;font-size:12px;">Assinatura do colaborador</div>
        <div style="flex:1;border-top:1px solid #333;padding-top:6px;text-align:center;font-size:12px;">Assinatura do responsável</div>
      </div>
    </div>`;
  }).join('<hr class="sep">');
  const w = window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Folha de Ponto — ${mes}</title>
    <style>
      body{font-family:Arial,sans-serif;padding:36px;color:#111;}
      h1{font-size:20px;margin-bottom:2px;} h2{font-size:14px;margin:10px 0 6px;border-bottom:1px solid #333;padding-bottom:4px;}
      table{width:100%;border-collapse:collapse;} th,td{border:1px solid #ccc;padding:5px 7px;text-align:left;font-size:11.5px;}
      th{background:#f0f0f0;} .tot{font-weight:bold;text-align:right;font-size:12.5px;margin-top:6px;}
      .sep{border:none;border-top:1px dashed #aaa;margin:20px 0;} .cap{color:#666;font-size:12px;margin-bottom:16px;}
    </style></head><body>
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:10px;">
      ${LOGO_SVG_PRINT(40)}
      <div><div style="font-size:17px;font-weight:800;letter-spacing:.5px;">ObraGest</div><div style="font-size:11px;color:#666;">Engenharia &amp; Obras</div></div>
    </div>
    <h1>Folha de Ponto — ${esc(o.nome)}</h1>
    <p class="cap">Mês de referência: ${mesNum}/${ano} &nbsp;|&nbsp; Emitido em ${fmtDate(nowISO())} pelo ObraGest.</p>
    ${secoes || '<p>Nenhum profissional com registros neste mês.</p>'}
    <script>window.print()<\/script>
    </body></html>`);
  w.document.close();
}

function renderEspecialidade(key){
  return requireObra(()=>{
    const cfg = ESPEC_CONFIG[key];
    const itens = DB[key].filter(i=>i.obraId===STATE.obraId);
    const rows = itens.map(i=>{
      const done = isItemDone(key, i);
      const linked = findLinkedTarefa(key, i.id);
      const label = i.ambiente || i.descricao || cfg.itemLabel;
      const nFotos = (i.fotos||[]).length;
      return `<tr>
      ${cfg.cols.map(c=>`<td>${esc(i[c]||'—')}</td>`).join('')}
      <td><span class="badge badge-${done?'green':'muted'}" style="cursor:pointer;" onclick="toggleEspecStatus('${key}','${i.id}')">${done?'Concluído':'Pendente'}</span></td>
      <td class="row-actions">
        ${nFotos?`<button class="btn btn-sm" title="Ver fotos" onclick="viewFotosEspec('${key}','${i.id}')">📷 ${nFotos}</button>`:''}
        <button class="btn btn-sm" title="${linked?'Ver tarefa vinculada':'Criar tarefa vinculada'}" onclick="criarOuAbrirTarefaVinculada('${key}','${i.id}','${esc(cfg.title)}: ${esc(label).replace(/'/g,"\\'")}')">${linked?'🔗':'+ Tarefa'}</button>

        <button class="btn btn-sm btn-danger" onclick="deleteEspec('${key}','${i.id}')">✕</button>
      </td></tr>`;
    }).join('');
    return `
    <div class="card">

function especFieldsHtml(cfg, i){
  return cfg.fields.map(f=>{

    }
    return `<div class="field"><label>${f.label}</label><input type="${f.type}" name="${f.name}" value="${esc(i[f.name]||'')}" placeholder="${f.ph||''}"></div>`;

function openEspecForm(key,id){
  const cfg = ESPEC_CONFIG[key];
  const i = id ? DB[key].find(x=>x.id===id) : {};
  window._especFotos = (i.fotos||[]).slice();
  openModal(`
    <div class="modal-head"><h3>${id?'Editar':'Adicionar'} ${cfg.itemLabel}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>

      </div>

      </div>
    </form>
  `, true);
}
function renderFotosEspecBlock(){
  const arr = window._especFotos || [];
  const thumbs = arr.map((f,idx)=>fotoTileHtml(f, `removeFotoEspec(${idx})`)).join('');
  return `
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;">${thumbs}</div>
    ${arr.length < 8 ? `<input type="file" accept="image/*" multiple capture="environment" onchange="addFotosEspec(event)">` : `<div class="hint">Limite de 8 fotos atingido.</div>`}
    <div class="hint">${arr.length}/8 fotos</div>
    ${arr.length < 8 ? linkAnexoInputHtml('especFotoLink', `addFotoLinkEspec()`) : ''}
  `;
}
function addFotoLinkEspec(){
  const inp = document.getElementById('especFotoLink');
  const url = (inp.value||'').trim();
  if(!isValidHttpUrl(url)){ toast('Cole um link válido (começando com http:// ou https://).'); return; }
  window._especFotos.push({link:url, nome:'Link anexado'});
  refreshFotosEspecUI();
}
function addFotosEspec(e){
  const arr = window._especFotos;
  const files = Array.from(e.target.files||[]);
  const vagas = 8 - arr.length;
  if(vagas<=0){ toast('Máximo de 8 fotos.'); e.target.value=''; return; }
  const aceitar = files.slice(0, vagas);
  if(files.length > vagas) toast('Apenas '+vagas+' foto(s) adicionada(s) — limite de 8.');
  let pendentes = aceitar.length;
  if(!pendentes){ e.target.value=''; return; }
  aceitar.forEach(file=>{
    if(!/^image\//.test(file.type)){ toast('Envie apenas imagens.'); pendentes--; if(pendentes<=0) refreshFotosEspecUI(); return; }
    if(file.size > 8*1024*1024){ toast('Imagem muito grande (limite 8MB): '+file.name); pendentes--; if(pendentes<=0) refreshFotosEspecUI(); return; }
    uploadArquivo(file, 'especialidades').then(url=>{
      arr.push({dataUrl:url, nome:file.name});
      pendentes--;
      if(pendentes<=0) refreshFotosEspecUI();
    }).catch(err=>{ console.error(err); toast('⚠️ Falha ao enviar foto: '+file.name); pendentes--; if(pendentes<=0) refreshFotosEspecUI(); });
  });
  e.target.value='';
}
function removeFotoEspec(idx){ window._especFotos.splice(idx,1); refreshFotosEspecUI(); }
function refreshFotosEspecUI(){ const wrap=document.getElementById('especFotosWrap'); if(wrap) wrap.innerHTML = renderFotosEspecBlock(); }
function viewFotosEspec(key,id){
  const i = DB[key].find(x=>x.id===id);
  if(!i) return;
  const arr = i.fotos||[];
  openModal(`
    <div class="modal-head"><h3>Fotos</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    ${arr.length ? `<div style="display:flex;flex-wrap:wrap;gap:8px;">${arr.map(f=>fotoViewTileHtml(f)).join('')}</div>` : `<p class="hint">Nenhuma foto anexada ainda.</p>`}
    <div class="btn-row">
      <button type="button" class="btn btn-primary" onclick="openEspecForm('${key}','${id}')">Editar</button>
      <button type="button" class="btn" onclick="closeModal()">Fechar</button>
    </div>
  `, true);
}
function saveEspec(e,key,id){
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target).entries());
  data.fotos = window._especFotos || [];
  if(id) Object.assign(DB[key].find(x=>x.id===id), data);
  else { data.id=uid(); data.obraId=STATE.obraId; DB[key].push(data); }
  saveDB(); closeModal(); toast('Salvo.'); window._especFotos=null; go(key);
}
function deleteEspec(key,id){
  DB[key] = DB[key].filter(x=>x.id!==id);
  saveDB(); closeModal(); toast('Removido.'); go(key);
}
function toggleEspecStatus(key,id){
  const i = DB[key].find(x=>x.id===id);
  const done = !isItemDone(key, i);
  setItemDone(key, id, done);
  syncTarefaFromOrigem(key, id, done);
  saveDB(); go(key);
}

const TABELA_FIO = [ [15.5,1.5], [21,2.5], [28,4], [36,6], [50,10], [68,16], [89,25], [110,35] ];
function disjuntorPadrao(correnteA){
  const padroes = [10,16,20,25,32,40,50,63,70,80,100];
  return padroes.find(p=>p>=correnteA) || padroes[padroes.length-1];
}
function secaoFioPara(correnteA){
  const found = TABELA_FIO.find(t=>correnteA<=t[0]);
  return found ? found[1] : TABELA_FIO[TABELA_FIO.length-1][1];
}

      <div id="calcOut"></div>
      <div class="hint">Rolos = (Área × (1 + perda%)) / rendimento do rolo. Padrões com repetição/rapport grande exigem mais perda — confira a ficha técnica do papel escolhido.</div>
      </div>`,
  };
  openModal(`
    <div class="modal-head"><h3>Calculadora — ${ESPEC_CONFIG[key].title}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    ${forms[key]}
  `);
}
function calcEletrica(){
  const pot = Number(document.getElementById('c_pot').value)||0;
  const v = Number(document.getElementById('c_tensao').value)||220;
  const fp = Number(document.getElementById('c_fp').value)||1;
  const corrente = pot/(v*fp);
  const disj = disjuntorPadrao(corrente);
  const secao = secaoFioPara(corrente);
  document.getElementById('calcOut').innerHTML = `<div class="calc-result">
    Corrente estimada: <b>${corrente.toFixed(2)} A</b><br>
    Disjuntor sugerido: <b>${disj} A</b><br>
    Seção mínima de condutor sugerida: <b>${secao} mm²</b>
  </div>`;
}
function calcHidraulica(){
  const pecas = Number(document.getElementById('c_pecas').value)||1;
  const vazaoPeca = Number(document.getElementById('c_vazaoPeca').value)||12;
  const vazaoTotal = pecas*vazaoPeca;
  let diam = '20 mm (½")';
  if(vazaoTotal>60) diam = '32 mm (1")';
  else if(vazaoTotal>35) diam = '25 mm (¾")';
  document.getElementById('calcOut').innerHTML = `<div class="calc-result">
    Vazão total estimada: <b>${vazaoTotal} L/min</b><br>
    Diâmetro mínimo recomendado (ramal principal): <b>${diam}</b>
  </div>`;
}
function calcForros(){
  const area = Number(document.getElementById('c_area').value)||0;
  const areaPlaca = Number(document.getElementById('c_tipoforro').value)||0.36;
  const perda = Number(document.getElementById('c_perda').value)||10;
  const areaComPerda = area*(1+perda/100);
  const qtdPlacas = Math.ceil(areaComPerda/areaPlaca);
  const perfisEstimado = Math.ceil(area*0.9); // regra prática ~0.9m linear de perfil por m² de forro
  document.getElementById('calcOut').innerHTML = `<div class="calc-result">
    Quantidade de placas: <b>${qtdPlacas} un</b><br>
    Perfis/estrutura estimados: <b>${perfisEstimado} m linear</b>
  </div>`;
}
function calcAudio(){
  const area = Number(document.getElementById('c_areaAud').value)||0;
  const cobertura = Number(document.getElementById('c_cobertura').value)||20;
  const qtd = Math.ceil(area/cobertura);
  document.getElementById('calcOut').innerHTML = `<div class="calc-result">
    Quantidade estimada de caixas de teto: <b>${qtd} un</b>
  </div>`;
}
function calcMarcenaria(){
  const area = Number(document.getElementById('c_areaMoveis').value)||0;
  const chapaM2 = Number(document.getElementById('c_chapa').value)||5.06;
  const perda = Number(document.getElementById('c_perdaMoveis').value)||0;
  const chapas = Math.ceil((area*(1+perda/100))/chapaM2);
  document.getElementById('calcOut').innerHTML = `<div class="calc-result">
    Chapas necessárias: <b>${chapas} un</b> (≈${(chapas*chapaM2).toFixed(2)} m² brutos para ${area} m² úteis)
  </div>`;
}
function calcSerralheria(){
  const area = Number(document.getElementById('c_areaMetal').value)||0;
  const consumo = Number(document.getElementById('c_tipoMetal').value)||15;
  const unid = document.getElementById('c_unidMetal').value;
  const peso = area*consumo;
  document.getElementById('calcOut').innerHTML = `<div class="calc-result">
    Peso estimado de aço/alumínio: <b>${peso.toFixed(1)} kg</b> (${area} ${unid==='m2'?'m²':'m linear'} × ${consumo} kg/${unid==='m2'?'m²':'m'})
  </div>`;
}
function calcDecoracao(){
  const area = Number(document.getElementById('c_areaPapel').value)||0;
  const rend = Number(document.getElementById('c_rendPapel').value)||5;
  const perda = Number(document.getElementById('c_perdaPapel').value)||0;
  const rolos = Math.ceil((area*(1+perda/100))/rend);
  document.getElementById('calcOut').innerHTML = `<div class="calc-result">
    Rolos de papel de parede necessários: <b>${rolos} un</b>
  </div>`;
}
function calcEletrotecnica(){
  const circ = Number(document.getElementById('c_circ').value)||0;
  const reserva = Number(document.getElementById('c_reserva').value)||20;
  const total = Math.ceil(circ*(1+reserva/100));
  document.getElementById('calcOut').innerHTML = `<div class="calc-result">
    Espaços (polos) sugeridos no quadro: <b>${total}</b>
  </div>`;
}
function calcQuedaTensao(){
  const I = Number(document.getElementById('c_qtCorrente').value)||0;
  const L = Number(document.getElementById('c_qtComprimento').value)||0;
  const S = Number(document.getElementById('c_qtSecao').value)||2.5;
  const V = Number(document.getElementById('c_qtTensao').value)||220;
  const rho = 0.0178; // Ω·mm²/m (cobre, aprox.)
  const quedaV = (2*L*I*rho)/S;
  const quedaPct = (quedaV/V)*100;
  const status = quedaPct<=4 ? `<span class="badge badge-green">Dentro do limite (≤4%)</span>` : `<span class="badge badge-red">Acima do limite recomendado</span>`;
  document.getElementById('calcOut2').innerHTML = `<div class="calc-result">
    Queda de tensão estimada: <b>${quedaV.toFixed(2)} V</b> (${quedaPct.toFixed(2)}%)<br>
    ${status}
  </div>`;
}
function calcSPDA(){
  const perim = Number(document.getElementById('c_perimetro').value)||0;
  const esp = Number(document.getElementById('c_espacamento').value)||15;
  const captores = Math.max(4, Math.ceil(perim/esp));
  document.getElementById('calcOut2').innerHTML = `<div class="calc-result">
    Nº estimado de captores no perímetro: <b>${captores} un</b>
  </div>`;
}
function calcReservatorio(){
  const hab = Number(document.getElementById('c_habitantes').value)||0;
  const consumo = Number(document.getElementById('c_consumoPC').value)||150;
  const autonomia = Number(document.getElementById('c_autonomia').value)||1;
  const volumeL = hab*consumo*autonomia;
  const volumeM3 = volumeL/1000;
  document.getElementById('calcOut3').innerHTML = `<div class="calc-result">
    Volume de reservação estimado: <b>${volumeL.toLocaleString('pt-BR')} L</b> (≈ ${volumeM3.toFixed(2)} m³)
  </div>`;
}
function calcFossa(){
  const pessoas = Number(document.getElementById('c_pessoasFossa').value)||0;
  const contrib = Number(document.getElementById('c_contribEsgoto').value)||130;
  const periodo = Number(document.getElementById('c_periodoDet').value)||1;
  const volumeLiquido = pessoas*contrib*periodo;
  const lodoDigerido = pessoas*65; // estimativa simplificada de acúmulo de lodo (L), referência NBR 7229 p/ limpeza anual
  const volumeTotalL = volumeLiquido + lodoDigerido;
  document.getElementById('calcOut4').innerHTML = `<div class="calc-result">
    Volume útil líquido estimado: <b>${volumeLiquido.toLocaleString('pt-BR')} L</b><br>
    Volume de lodo (estimativa): <b>${lodoDigerido.toLocaleString('pt-BR')} L</b><br>
    Volume total sugerido: <b>${volumeTotalL.toLocaleString('pt-BR')} L</b> (≈ ${(volumeTotalL/1000).toFixed(2)} m³)
  </div>`;
}
function calcVigaPre(){
  const vao = Number(document.getElementById('c_vaoViga').value)||0;
  const alturaCm = Math.max(20, Math.round((vao/12)*100));
  document.getElementById('calcOut').innerHTML = `<div class="calc-result">
    Altura estimada da viga: <b>${alturaCm} cm</b><br>
    <span style="color:var(--muted2);font-size:12px;">Largura usual mínima: 12 cm (alvenaria) ou conforme fôrma adotada.</span>
  </div>`;
}
function calcPilarPre(){
  const carga = Number(document.getElementById('c_cargaPilar').value)||0;
  const fck = Number(document.getElementById('c_fckPilar').value)||25;
  const tensaoAdm = 0.3*fck; // MPa ≈ N/mm², critério simplificado
  const areaCm2 = (carga*1000)/(tensaoAdm*100); // kN->N, MPa->N/mm², resultado em cm²
  const lado = Math.max(19, Math.round(Math.sqrt(areaCm2)));
  document.getElementById('calcOut2').innerHTML = `<div class="calc-result">
    Área de seção estimada: <b>${areaCm2.toFixed(0)} cm²</b><br>
    Seção quadrada aproximada: <b>${lado} x ${lado} cm</b>
  </div>`;
}
function calcLajePre(){
  const vao = Number(document.getElementById('c_vaoLaje').value)||0;
  const espessuraCm = Math.max(10, Math.round((vao/40)*100));
  document.getElementById('calcOut3').innerHTML = `<div class="calc-result">
    Espessura estimada da laje: <b>${espessuraCm} cm</b>
  </div>`;
}
function calcAlvenaria(){
  const area = Number(document.getElementById('c_areaParede').value)||0;
  const blocosPorM2 = Number(document.getElementById('c_tipoBloco').value)||12.5;
  const blocos = Math.ceil(area*blocosPorM2*1.05); // 5% de perda
  const argamassaM3 = (area*0.03).toFixed(2);
  document.getElementById('calcOut').innerHTML = `<div class="calc-result">
    Quantidade de blocos (com 5% de perda): <b>${blocos} un</b><br>
    Argamassa de assentamento estimada: <b>${argamassaM3} m³</b>
  </div>`;
}
function calcConcreto(){
  const vol = Number(document.getElementById('c_volConcreto').value)||0;
  const [c,a,b] = document.getElementById('c_traco').value.split(',').map(Number);
  const somaPartes = c+a+b;
  // referência simplificada: ≈ 300 kg de cimento por m³ de concreto no traço médio (ajustada pela proporção)
  const cimentoKg = Math.round((vol*300)*(1));
  const cimentoSacos = Math.ceil(cimentoKg/50);
  const areiaM3 = (vol*(a/somaPartes)*1.15).toFixed(2);
  const britaM3 = (vol*(b/somaPartes)*1.15).toFixed(2);
  document.getElementById('calcOut2').innerHTML = `<div class="calc-result">
    Cimento estimado: <b>${cimentoKg} kg</b> (≈ ${cimentoSacos} sacos de 50 kg)<br>
    Areia estimada: <b>${areiaM3} m³</b><br>
    Brita estimada: <b>${britaM3} m³</b><br>
    <span style="color:var(--muted2);font-size:12px;">Estimativa por traço unitário simplificado — não substitui dosagem experimental de concreto.</span>
  </div>`;
}
function calcTinta(){
  const area = Number(document.getElementById('c_areaPintura').value)||0;
  const demaos = Number(document.getElementById('c_demaos').value)||2;
  const rendimento = Number(document.getElementById('c_rendimento').value)||6;
  const litros = ((area*demaos)/rendimento).toFixed(1);
  document.getElementById('calcOut3').innerHTML = `<div class="calc-result">
    Quantidade de tinta estimada: <b>${litros} L</b>
  </div>`;
}

  else if(tipo==='art') fieldsHtml = planoFieldsArt(d);
  else if(tipo==='cronograma') fieldsHtml = planoFieldsCronograma(d);
  else fieldsHtml = planoFieldsChecklist(tipo,d);
  openModal(`
    <div class="modal-head"><h3>${PLANO_TIPOS[tipo].icon} ${id?'Editar':'Novo'} — ${PLANO_TIPOS[tipo].label}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>

      ${fieldsHtml}
      <div class="btn-row">
        <button type="submit" class="btn btn-primary">Salvar</button>
        <button type="button" class="btn" onclick="closeModal()">Cancelar</button>
        ${id?`<button type="button" class="btn btn-danger" onclick="deletePlano('${id}')">Excluir</button>`:''}
      </div>
    </form>
  `, true);
  if(tipo==='cronograma') renderCronoItens();
}
function savePlano(e,tipo,id){
  e.preventDefault();
  const form = e.target;
  const raw = Object.fromEntries(new FormData(form).entries());
  let dados = {};
  if(tipo==='cronograma'){
    dados = {titulo:raw.titulo, itens:(window._planoEdit||[]).filter(i=>i.etapa)};
  } else if(tipo==='seguranca' || tipo==='acessibilidade'){
    const checklist = {};
    CHECKLIST_ITEMS[tipo].forEach((_,idx)=>{ checklist[idx] = !!raw['chk_'+idx]; });
    dados = {titulo:raw.titulo, responsavel:raw.responsavel, dataElaboracao:raw.dataElaboracao, observacoes:raw.observacoes, checklist};
  } else {
    dados = raw;
  }
  if(id){
    const p = DB.planos.find(x=>x.id===id);
    p.tipo=tipo; p.dados=dados; p.titulo=dados.titulo;
  } else {

}

/* ============================================================
   PLANTA TÉCNICA — editor de esboço 2D em canvas (grid em escala,
   cômodos, paredes, cotas e marcadores vinculados a tarefas),
   inspirado nos comandos básicos do AutoCAD (RECTANG, LINE, DIM).
   Não substitui um projeto executivo real em CAD — é uma
   ferramenta de estudo/comunicação rápida dentro do app.
   ============================================================ */
function renderPlantaTecnica(){
  return requireObra(()=>{
    const o = currentObra();
    if(!window._cad || window._cad.obraId !== o.id){
      const salvo = o.plantaTecnica || {};
      window._cad = {
        obraId: o.id,
        tool: 'select',
        scale: salvo.scale || 30,
        shapes: (salvo.shapes||[]).map(s=>({...s})),
        drag: null,
      };
    }
    const cad = window._cad;
    const tools = [
      ['select','↖️ Selecionar'], ['room','▭ Cômodo'], ['wall','／ Parede'],
      ['dim','📏 Cota'], ['pin','📍 Marcador'], ['erase','🗑️ Apagar'],
    ];
    return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
        <div class="card-title" style="margin:0;">Planta técnica — ${esc(o.nome)}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-sm" onclick="cadImportarComodos()">↙ Importar cômodos</button>
          <button class="btn btn-sm" onclick="cadExportarImagem()">⬇ Exportar PNG</button>
          <button class="btn btn-sm btn-danger" onclick="cadLimparTudo()">Limpar tudo</button>
          <button class="btn btn-primary btn-sm" onclick="cadSalvar()">Salvar planta</button>
        </div>
      </div>
      <div class="cad-toolbar">
        ${tools.map(([k,l])=>`<button type="button" class="cad-tool ${cad.tool===k?'active':''}" onclick="cadSetTool('${k}')">${l}</button>`).join('')}
        <div style="margin-left:auto;display:flex;align-items:center;gap:6px;">
          <label class="hint" style="margin:0;">Escala (px/m)</label>
          <input type="number" min="10" max="80" value="${cad.scale}" style="width:64px;padding:5px;" onchange="cadSetScale(this.value)">
        </div>
      </div>
      <div class="hint" style="margin-bottom:8px;">Cada quadrado do grid = 1 m. Toque/arraste para desenhar cômodos, paredes ou cotas. "Selecionar" renomeia um cômodo ou abre a tarefa de um marcador. Isso é um esboço de estudo/comunicação — não substitui o projeto executivo em AutoCAD.</div>
      <div class="cad-canvas-wrap"><canvas id="cadCanvas" width="1000" height="600"></canvas></div>
      <div class="cad-legend" id="cadLegend"></div>
    </div>`;
  });
}
function cadSetTool(t){ window._cad.tool = t; renderPage(); }
function cadSetScale(v){ window._cad.scale = Math.max(10, Math.min(80, Number(v)||30)); renderPage(); }
function cadLimparTudo(){ if(!confirm('Apagar todos os elementos desta planta?')) return; window._cad.shapes=[]; renderPage(); }
function cadSalvar(){
  const cad = window._cad;
  const o = DB.obras.find(x=>x.id===cad.obraId);
  if(!o) return;
  o.plantaTecnica = { scale: cad.scale, shapes: cad.shapes };
  saveDB(); toast('Planta salva.');
}
function cadExportarImagem(){
  const canvas = document.getElementById('cadCanvas'); if(!canvas) return;
  const url = canvas.toDataURL('image/png');
  const a = document.createElement('a');
  a.href = url; a.download = (currentObra()?currentObra().nome:'planta').replace(/[^a-z0-9]+/gi,'_')+'_planta.png';
  document.body.appendChild(a); a.click(); a.remove();
}
function cadImportarComodos(){
  const cad = window._cad;
  const o = DB.obras.find(x=>x.id===cad.obraId);
  const comodos = (o.comodos||[]).filter(c=>c.area && Number(c.area)>0);
  if(!comodos.length){ toast('Nenhum cômodo com metragem cadastrada em "Obras".'); return; }
  if(cad.shapes.some(s=>s.type==='room') && !confirm('Isso adiciona os cômodos da lista de metragens como novos blocos na planta. Continuar?')) return;
  let cx=20, cy=20, rowH=0; const maxW=960;
  const TIPO_COR = {'Reforma':'#F4B942','Construção':'#2F80ED','Modificação':'#3DBE64'};
  comodos.forEach(c=>{
    const lado = Math.max(40, Math.round(Math.sqrt(Number(c.area))*cad.scale));
    if(cx+lado>maxW){ cx=20; cy+=rowH+20; rowH=0; }
    cad.shapes.push({type:'room', x:cx, y:cy, w:lado, h:lado, nome:c.nome, cor:TIPO_COR[c.tipo]||'#7a8699'});
    cx += lado+20; rowH = Math.max(rowH, lado);
  });
  renderPage();
}
function cadAtualizarLegenda(){
  const cad = window._cad; const el = document.getElementById('cadLegend'); if(!el) return;
  const rooms = cad.shapes.filter(s=>s.type==='room');
  const total = rooms.reduce((s,r)=>s+(r.w/cad.scale)*(r.h/cad.scale),0);
  el.innerHTML = rooms.length ? `<span class="badge badge-blue">${rooms.length} cômodo(s) · ${total.toFixed(2)} m² no desenho</span>` : '';
}
function cadDistToSegment(p,a,b){
  const l2 = (b.x-a.x)**2+(b.y-a.y)**2;
  if(l2===0) return Math.hypot(p.x-a.x,p.y-a.y);
  let t = ((p.x-a.x)*(b.x-a.x)+(p.y-a.y)*(b.y-a.y))/l2;
  t = Math.max(0,Math.min(1,t));
  const proj = {x:a.x+t*(b.x-a.x), y:a.y+t*(b.y-a.y)};
  return Math.hypot(p.x-proj.x,p.y-proj.y);
}
function cadHitTest(cad,p){
  for(let i=cad.shapes.length-1;i>=0;i--){
    const s = cad.shapes[i];
    if(s.type==='room'){ if(p.x>=s.x&&p.x<=s.x+s.w&&p.y>=s.y&&p.y<=s.y+s.h) return i; }
    else if(s.type==='pin'){ if(Math.hypot(p.x-s.x,p.y-s.y)<12) return i; }
    else if(s.type==='wall'||s.type==='dim'){ if(cadDistToSegment(p,{x:s.x1,y:s.y1},{x:s.x2,y:s.y2})<8) return i; }
  }
  return -1;
}
function cadSelectShape(idx){
  const cad = window._cad; const s = cad.shapes[idx];
  if(s.type==='room'){
    const novoNome = prompt('Renomear cômodo (ou cancelar para manter):', s.nome||'');
    if(novoNome!==null && novoNome.trim()) s.nome = novoNome.trim();
    drawCad(cad); cadAtualizarLegenda();
  } else if(s.type==='pin'){
    if(s.tarefaId) openTarefaForm(s.tarefaId);
    else toast(s.label||'Marcador sem vínculo.');
  }
}
function cadAbrirFormPin(x,y){
  const cad = window._cad;
  const tarefas = DB.tarefas.filter(t=>t.obraId===cad.obraId);
  openModal(`

    <div class="field"><label>Rótulo (opcional)</label><input id="cadPinLabel" placeholder="Ex: Ponto de energia"></div>
    <div class="field"><label>Vincular a uma tarefa (opcional)</label>
      <select id="cadPinTarefa">
        <option value="">— nenhuma —</option>
        ${tarefas.map(t=>`<option value="${t.id}">${esc(t.titulo)}</option>`).join('')}
      </select>
    </div>
    <div class="btn-row">
      <button type="button" class="btn btn-primary" onclick="cadConfirmarPin(${x},${y})">Adicionar</button>
      <button type="button" class="btn" onclick="closeModal()">Cancelar</button>
    </div>
  `, true);
}
function cadConfirmarPin(x,y){
  const cad = window._cad;
  const label = (document.getElementById('cadPinLabel').value||'').trim();
  const tarefaId = document.getElementById('cadPinTarefa').value||'';
  cad.shapes.push({type:'pin', x, y, label, tarefaId: tarefaId||null});
  closeModal(); drawCad(cad); cadAtualizarLegenda();
}
function cadDrawTick(ctx,x,y){ ctx.beginPath(); ctx.moveTo(x-4,y-4); ctx.lineTo(x+4,y+4); ctx.stroke(); }
function cadDrawShape(ctx,s,cad){
  if(s.type==='room'){
    const cor = s.cor || '#2F80ED';
    ctx.fillStyle = cor+'26'; ctx.strokeStyle = cor; ctx.lineWidth=2;
    ctx.fillRect(s.x,s.y,s.w,s.h); ctx.strokeRect(s.x,s.y,s.w,s.h);
    const areaM2 = Math.abs((s.w/cad.scale)*(s.h/cad.scale));
    ctx.fillStyle = '#EAF2FF'; ctx.font='12px sans-serif'; ctx.textAlign='center';
    ctx.fillText(s.nome||'Cômodo', s.x+s.w/2, s.y+s.h/2-4);
    ctx.fillText(areaM2.toFixed(2)+' m²', s.x+s.w/2, s.y+s.h/2+12);
  } else if(s.type==='wall'){
    ctx.strokeStyle='#B8C4DA'; ctx.lineWidth=6; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2); ctx.stroke();
  } else if(s.type==='dim'){
    const dist = Math.hypot(s.x2-s.x1, s.y2-s.y1); const metros = (dist/cad.scale).toFixed(2);
    ctx.strokeStyle='#F4B942'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2); ctx.stroke();
    cadDrawTick(ctx,s.x1,s.y1); cadDrawTick(ctx,s.x2,s.y2);
    const mx=(s.x1+s.x2)/2, my=(s.y1+s.y2)/2;
    ctx.fillStyle='#F4B942'; ctx.font='11px sans-serif'; ctx.textAlign='center';
    ctx.fillText(metros+' m', mx, my-6);
  } else if(s.type==='pin'){
    ctx.fillStyle = s.tarefaId ? '#3DBE64' : '#E5484D';
    ctx.beginPath(); ctx.arc(s.x,s.y,7,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#0c1526'; ctx.lineWidth=2; ctx.stroke();
    if(s.label){ ctx.fillStyle='#EAF2FF'; ctx.font='11px sans-serif'; ctx.textAlign='left'; ctx.fillText(s.label, s.x+10, s.y+4); }
  }
}
function drawCad(cad){
  const canvas = document.getElementById('cadCanvas'); if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#0c1526'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth=1;
  for(let x=0;x<=W;x+=cad.scale){ ctx.beginPath(); ctx.moveTo(x+0.5,0); ctx.lineTo(x+0.5,H); ctx.stroke(); }
  for(let y=0;y<=H;y+=cad.scale){ ctx.beginPath(); ctx.moveTo(0,y+0.5); ctx.lineTo(W,y+0.5); ctx.stroke(); }
  cad.shapes.forEach(s=>cadDrawShape(ctx,s,cad));
  if(cad.drag && cad.drag.preview) cadDrawShape(ctx,cad.drag.preview,cad);
}
function initCadCanvas(){
  const canvas = document.getElementById('cadCanvas'); if(!canvas) return;
  const cad = window._cad; if(!cad) return;
  drawCad(cad);
  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    const sx = canvas.width/rect.width, sy = canvas.height/rect.height;
    let x = (e.clientX-rect.left)*sx, y = (e.clientY-rect.top)*sy;
    const snap = cad.scale/2;
    x = Math.round(x/snap)*snap; y = Math.round(y/snap)*snap;
    return {x,y};
  }
  canvas.onpointerdown = function(e){
    const p = getPos(e);
    if(cad.tool==='select'){ const idx=cadHitTest(cad,p); if(idx>=0) cadSelectShape(idx); return; }
    if(cad.tool==='erase'){ const idx=cadHitTest(cad,p); if(idx>=0){ cad.shapes.splice(idx,1); drawCad(cad); cadAtualizarLegenda(); } return; }
    if(cad.tool==='pin'){ cadAbrirFormPin(p.x,p.y); return; }
    cad.drag = {tool:cad.tool, x0:p.x, y0:p.y, preview:null};
  };
  canvas.onpointermove = function(e){
    if(!cad.drag) return;
    const p = getPos(e);
    const {tool,x0,y0} = cad.drag;
    if(tool==='room') cad.drag.preview = {type:'room', x:Math.min(x0,p.x), y:Math.min(y0,p.y), w:Math.abs(p.x-x0), h:Math.abs(p.y-y0), nome:'', cor:'#2F80ED'};
    else if(tool==='wall') cad.drag.preview = {type:'wall', x1:x0,y1:y0,x2:p.x,y2:p.y};
    else if(tool==='dim') cad.drag.preview = {type:'dim', x1:x0,y1:y0,x2:p.x,y2:p.y};
    drawCad(cad);
  };
  canvas.onpointerup = function(e){
    if(!cad.drag) return;
    const {tool} = cad.drag; const prev = cad.drag.preview; cad.drag=null;
    if(!prev){ drawCad(cad); return; }
    if(tool==='room'){
      if(prev.w<10||prev.h<10){ drawCad(cad); return; }
      prev.nome = prompt('Nome do cômodo:', 'Cômodo') || 'Cômodo';
      cad.shapes.push(prev);
    } else if(tool==='wall'){
      if(Math.hypot(prev.x2-prev.x1, prev.y2-prev.y1) < 5){ drawCad(cad); return; }
      cad.shapes.push(prev);
    } else if(tool==='dim'){
      if(Math.hypot(prev.x2-prev.x1, prev.y2-prev.y1) < 5){ drawCad(cad); return; }
      cad.shapes.push(prev);
    }
    drawCad(cad); cadAtualizarLegenda();
  };
  cadAtualizarLegenda();
}

/* ============================================================
   PAINEL FINANCEIRO (custo real da obra: orçamento + compras +
   mão de obra + alimentação, comparado ao valor do contrato)
   ============================================================ */
function renderFinanceiro(){
  return requireObra(()=>{
    const o = currentObra();
    const orcItens = DB.orcamentos.filter(i=>i.obraId===o.id);
    const totalOrcado = orcItens.reduce((s,i)=>s+(Number(i.valorTotal)||0),0);
    const totalOrcExecutado = orcItens.filter(i=>isItemDone('orcamentos',i)).reduce((s,i)=>s+(Number(i.valorTotal)||0),0);

    const comprasItens = DB.compras.filter(c=>c.obraId===o.id);
    const totalComprado = comprasItens.filter(c=>c.status==='comprado').reduce((s,c)=>s+(Number(c.precoEstimado)*Number(c.qtd||1)||0),0);
    const totalComprasPendente = comprasItens.filter(c=>c.status!=='comprado').reduce((s,c)=>s+(Number(c.precoEstimado)*Number(c.qtd||1)||0),0);

    const registros = DB.presencas.filter(x=>x.obraId===o.id);
    const totalMaoObra = registros.reduce((s,r)=>s+(Number(r.custoNormal)||0)+(Number(r.custoExtra)||0),0);
    const totalAlimentacao = registros.reduce((s,r)=>s+(Number(r.custoAlmoco)||0),0);

    const propostasNegociadas = DB.propostas.filter(p=>p.obraId===o.id && p.valorNegociado!==undefined && p.valorNegociado!=='').reduce((s,p)=>s+Number(p.valorNegociado),0);

    const diariasObra = DB.pagamentosDiarias.filter(x=>x.obraId===o.id);
    const totalDiariasPago = diariasObra.filter(x=>x.status==='pago').reduce((s,x)=>s+(Number(x.valor)||0),0);
    const totalDiariasPendente = diariasObra.filter(x=>x.status!=='pago').reduce((s,x)=>s+(Number(x.valor)||0),0);
    const propPagsObra = DB.pagamentosPropostas.filter(x=>x.obraId===o.id);
    const totalPropPago = propPagsObra.filter(x=>x.status==='pago').reduce((s,x)=>s+(Number(x.valor)||0),0);
    const liberacoesObra = DB.liberacoes.filter(x=>x.obraId===o.id);
    const totalLiberado = liberacoesObra.filter(x=>x.status==='liberado').reduce((s,x)=>s+(Number(x.valor)||0),0);
    const totalLiberacaoAberto = liberacoesObra.filter(x=>x.status==='solicitado'||x.status==='aprovado').reduce((s,x)=>s+(Number(x.valor)||0),0);

    const gastoReal = totalOrcExecutado + totalComprado + totalMaoObra + totalAlimentacao;
    const contrato = Number(o.valorContrato)||0;
    const saldo = contrato - gastoReal;
    const pctGasto = contrato ? Math.min(100, Math.round((gastoReal/contrato)*1000)/10) : null;

    const linha = (label,valor,cor)=>`<div class="total-line"><span>${label}</span><span style="${cor?`color:var(--${cor});font-weight:700;`:''}">${fmtMoney(valor)}</span></div>`;

    return `
    <div class="card">
      <div class="card-title" style="margin-bottom:12px;">Painel Financeiro — ${esc(o.nome)}</div>
      ${contrato ? `
      <div style="margin-bottom:16px;">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;">
          <span>Gasto real vs. valor do contrato</span><span><b>${pctGasto}%</b></span>
        </div>
        <div style="background:var(--border);border-radius:8px;height:14px;overflow:hidden;">
          <div style="width:${pctGasto}%;height:100%;background:${pctGasto>=100?'var(--red)':pctGasto>=85?'var(--gold)':'var(--green)'};"></div>
        </div>
      </div>` : `<p class="hint">Cadastre o "Valor do contrato" em Obras para acompanhar a margem/saldo automaticamente.</p>`}
      ${linha('Valor do contrato', contrato)}
      ${linha('Orçado (planejado, todos os itens)', totalOrcado)}
      ${linha('Executado do orçamento', totalOrcExecutado)}
      ${linha('Compras já realizadas', totalComprado)}
      ${linha('Compras pendentes (estimado)', totalComprasPendente)}
      ${linha('Mão de obra (presença)', totalMaoObra)}
      ${linha('Alimentação (presença)', totalAlimentacao)}
      ${propostasNegociadas ? linha('Propostas negociadas (fornecedores)', propostasNegociadas) : ''}
      <div class="total-line" style="font-size:16px;border-top:2px solid var(--border);margin-top:6px;padding-top:10px;"><span>Gasto real total (executado + compras + mão de obra + alimentação)</span><span><b>${fmtMoney(gastoReal)}</b></span></div>
      ${contrato ? linha(saldo>=0?'Saldo restante do contrato':'Estouro do contrato', Math.abs(saldo), saldo>=0?'green':'red') : ''}
      <div class="btn-row" style="margin-top:14px;">
        <button class="btn btn-sm" onclick="printFinanceiro()">🖨️ Imprimir resumo financeiro</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title" style="margin-bottom:10px;">Controle de Pagamentos — ${esc(o.nome)}</div>
      ${linha('Diárias/pessoal pagas', totalDiariasPago,'green')}
      ${linha('Diárias/pessoal pendentes', totalDiariasPendente,'gold')}
      ${linha('Propostas pagas', totalPropPago,'green')}
      ${linha('Valores liberados (ferramentas/serviços)', totalLiberado,'green')}
      ${linha('Liberações em aberto (solicitadas/aprovadas)', totalLiberacaoAberto,'gold')}
      <div class="btn-row" style="margin-top:10px;">
        <button class="btn btn-sm" onclick="go('pagamentos')">Abrir módulo de Pagamentos</button>
      </div>
      <div class="hint" style="margin-top:8px;">Valores informativos, de controle de caixa/liberações — não somados automaticamente ao "Gasto real total" acima, para evitar contagem duplicada com os cálculos de mão de obra (presença) e compras.</div>
    </div>
    <div class="warn-box">⚠️ "Executado do orçamento" e "Compras já realizadas" refletem os itens marcados como concluídos/comprados nos respectivos módulos. Mantenha os status atualizados para que este painel reflita a realidade da obra.</div>`;
  });
}

      <tr><td>Alimentação (presença)</td><td>${fmtMoney(totalAlimentacao)}</td></tr>
      <tr class="tot"><td>Gasto real total</td><td>${fmtMoney(gastoReal)}</td></tr>
      ${contrato?`<tr class="tot"><td>${saldo>=0?'Saldo restante':'Estouro do contrato'}</td><td>${fmtMoney(Math.abs(saldo))}</td></tr>`:''}
    </tbody></table>
    <script>window.print()<\/script>
    </body></html>`);
  w.document.close();
}

function renderConfig(){
  const isMaster = CURRENT_USER && CURRENT_USER.papel==='master';
  const usersRows = DB.usuarios.map(u=>`
    <tr>
      <td><b>${esc(u.nome||u.usuario)}</b><br><span style="color:var(--muted);font-size:12px;">@${esc(u.usuario)}</span></td>
      <td><span class="badge badge-${u.papel==='master'?'gold':'blue'}">${u.papel==='master'?'Master':'Operador'}</span></td>
      <td><span class="badge badge-${u.ativo===false?'red':'green'}">${u.ativo===false?'Inativo':'Ativo'}</span></td>
      <td class="row-actions">
        <button class="btn btn-sm" onclick="toggleUsuarioAtivo('${u.id}')">${u.ativo===false?'Reativar':'Desativar'}</button>
        <button class="btn btn-sm btn-danger" onclick="deleteUsuario('${u.id}')">✕</button>
      </td>
    </tr>`).join('');

  return `
  <div class="hl-banner">
    <div class="hl-icon">${ICONS.config}</div>
    <div class="hl-text">
      <div class="hl-eyebrow">Sessão atual</div>
      <div class="hl-title">${esc(CURRENT_USER.nome||CURRENT_USER.usuario)}</div>
      <div class="hl-sub">Usuário: @${esc(CURRENT_USER.usuario)} · Perfil: ${CURRENT_USER.papel==='master'?'Master (administrador)':'Operador'}</div>
    </div>
    <button class="hl-arrow" onclick="handleLogout()" title="Sair">⏻</button>
  </div>

  <div class="card">
    <div class="card-title">Alterar minha senha</div>
    ${CURRENT_USER.papel==='master'
      ? `<p class="hint">A senha do usuário master é fixa e definida na configuração do sistema.</p>`
      : `<form onsubmit="return handleChangePassword(event)">
          <div class="field"><label>Senha atual</label><input type="password" name="senhaAtual" required></div>
          <div class="field"><label>Nova senha</label><input type="password" name="novaSenha" required minlength="4"></div>
          <div id="pwError" class="login-error" style="display:none;"></div>
          <button type="submit" class="btn btn-primary">Atualizar senha</button>
        </form>`}
  </div>

  ${isMaster ? `
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <div class="card-title" style="margin:0;">Usuários do sistema</div>
      <button class="btn btn-primary btn-sm" onclick="openUsuarioForm()">+ Novo usuário</button>
    </div>
    ${DB.usuarios.length ? `<div class="table-wrap"><table>
      <thead><tr><th>Usuário</th><th>Perfil</th><th>Status</th><th></th></tr></thead>
      <tbody>${usersRows}</tbody></table></div>` : `<div class="empty-state"><div class="big">👤</div><p>Nenhum usuário adicional cadastrado. Apenas o usuário master tem acesso.</p></div>`}
    <p class="hint">O usuário master (@${MASTER_USER}) é fixo e não pode ser removido.</p>
  </div>` : ''}

  <div class="card">
    <div class="card-title">Dados do sistema</div>
    <p class="hint">Todos os dados e documentos ficam salvos no banco de dados online (Firebase) e são compartilhados automaticamente entre todos os usuários. Use o backup como cópia de segurança extra.</p>
    <div class="btn-row" style="margin-top:0;">
      <button class="btn" onclick="exportBackup()">⇩ Exportar backup (JSON)</button>
      <button class="btn" onclick="document.getElementById('importFile').click()">⇧ Importar backup</button>
    </div>
  </div>
  `;
}
function openUsuarioForm(){
  openModal(`
    <div class="modal-head"><h3>Novo usuário</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <form onsubmit="return saveUsuario(event)">
      <div class="field"><label>Nome</label><input name="nome" required></div>
      <div class="field"><label>Usuário (login) *</label><input name="usuario" required autocomplete="off"></div>
      <div class="field"><label>Senha inicial *</label><input type="password" name="senha" required minlength="4"></div>
      <div id="userFormError" class="login-error" style="display:none;"></div>
      <div class="btn-row"><button type="submit" class="btn btn-primary">Criar usuário</button><button type="button" class="btn" onclick="closeModal()">Cancelar</button></div>
    </form>
  `);
}
async function saveUsuario(e){
  e.preventDefault();
  const f = new FormData(e.target);
  const usuario = f.get('usuario').trim();
  const errBox = document.getElementById('userFormError');
  if(usuario.toLowerCase()===MASTER_USER || DB.usuarios.some(u=>u.usuario.toLowerCase()===usuario.toLowerCase())){
    errBox.textContent = 'Já existe um usuário com esse login.'; errBox.style.display='block'; return false;
  }
  const salt = randomSalt();
  const senhaHash = await hashSenha(f.get('senha'), salt);
  DB.usuarios.push({id:uid(), nome:f.get('nome')||usuario, usuario, salt, senhaHash, papel:'operador', ativo:true, criadoEm:nowISO()});
  saveDB(); closeModal(); toast('Usuário criado.'); go('config');
  return false;
}
function toggleUsuarioAtivo(id){
  const u = DB.usuarios.find(x=>x.id===id);
  u.ativo = u.ativo===false ? true : false;
  saveDB(); go('config');
}
function deleteUsuario(id){
  if(!confirm('Remover este usuário? Ele perderá o acesso ao sistema.')) return;
  DB.usuarios = DB.usuarios.filter(x=>x.id!==id);
  saveDB(); toast('Usuário removido.'); go('config');
}
async function handleChangePassword(e){
  e.preventDefault();
  const f = new FormData(e.target);
  const errBox = document.getElementById('pwError');
  const u = DB.usuarios.find(x=>x.id===CURRENT_USER.id);
  const hashAtual = await hashSenha(f.get('senhaAtual'), u.salt);
  if(hashAtual!==u.senhaHash){
    errBox.textContent='Senha atual incorreta.'; errBox.style.display='block'; return false;
  }
  u.salt = randomSalt();
  u.senhaHash = await hashSenha(f.get('novaSenha'), u.salt);
  saveDB(); toast('Senha atualizada.'); e.target.reset();
  return false;
}

/* ============================================================
   BACKUP (Export / Import)
   ============================================================ */
function exportBackup(){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'obragest-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(url);
  toast('Backup exportado.');
}
function importBackup(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!confirm('Importar este backup substituirá todos os dados atuais. Continuar?')) return;
      DB = Object.assign(defaultDB(), parsed);
      STATE.obraId = DB.meta.currentObraId || null;
      saveDB(); renderSidebar(); go(STATE.module);
      toast('Backup importado com sucesso.');
    }catch(e){ alert('Arquivo inválido.'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

async function bootApp(){
  const bootMsg = document.getElementById('cloudBootMsg');
  if(typeof firebase === 'undefined'){
    if(bootMsg) bootMsg.textContent = 'Não foi possível carregar as bibliotecas do Firebase (sem internet ou bloqueadas pela rede/navegador). Verifique sua conexão e recarregue a página.';
    return;
  }
  if(!firebaseConfig.apiKey || firebaseConfig.apiKey==='COLE_AQUI_SUA_API_KEY' || /SEU-PROJETO/.test(firebaseConfig.authDomain||'')){
    if(bootMsg) bootMsg.textContent = 'Configuração do Firebase ainda não preenchida. Abra o arquivo, procure por "firebaseConfig" e cole os dados do SEU projeto Firebase (veja o guia de configuração). Depois recarregue a página.';
    return;
  }
  if(location.protocol !== 'http:' && location.protocol !== 'https:'){
    if(bootMsg) bootMsg.textContent = 'Este arquivo foi aberto diretamente (endereço "'+location.protocol+'"), e o Firebase não funciona assim. Hospede o arquivo em um endereço web (Firebase Hosting, GitHub Pages, ou um servidor local) e acesse por http:// ou https:// — não abra tocando no arquivo dentro do app de Downloads.';
    return;
  }
  try{
    await fbAuth.signInAnonymously();
    await initCloudSync();
    CLOUD_READY = true;
  }catch(e){
    console.error('Falha ao conectar ao Firebase', e);
    if(bootMsg){
      if(e && e.code === 'auth/network-request-failed'){
        bootMsg.textContent = 'Não foi possível alcançar os servidores do Firebase. Verifique: 1) sua conexão com a internet; 2) se o "Anonymous" está ativado em Authentication → Sign-in method no console do Firebase; 3) se os valores em firebaseConfig (apiKey, authDomain, projectId) foram colados corretamente. Depois recarregue a página.';
      } else {
        bootMsg.textContent = 'Não foi possível conectar ao banco de dados online. Verifique a configuração do Firebase (firebaseConfig) e sua conexão, depois recarregue a página.';
      }
    }
    return; // não libera o app sem conexão, para não trabalhar "no vazio"
  }
  document.getElementById('cloudBoot').style.display = 'none';
  document.getElementById('loginScreen').style.display = '';
  const _sessionUser = checkSession();
  if(_sessionUser){
    CURRENT_USER = _sessionUser;
    showApp();
  } else {
    showLogin();
  }
}
bootApp();
</script>
