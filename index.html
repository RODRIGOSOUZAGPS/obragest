<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0, minimum-scale=1.0, user-scalable=yes">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%230A1526'/%3E%3Cpath d='M20 78 L50 22 L80 78 Z' fill='none' stroke='%23FF8A1E' stroke-width='7'/%3E%3Cline x1='32' y1='78' x2='68' y2='78' stroke='%23FF8A1E' stroke-width='7'/%3E%3C/svg%3E">
<link rel="manifest" href='data:application/manifest+json,{"name":"ObraGest - Gest%C3%A3o de Obras","short_name":"ObraGest","start_url":".","display":"standalone","background_color":"%230A1526","theme_color":"%230A1526"}'>

<title>ObraGest — Gestão de Obras Civis</title>

<style>
:root{
  --bg:#0A1526;
  --bg2:#0E1E36;
  --panel:#122642;
  --panel2:#193357;
  --border:#25406A;
  --text:#EDF2FA;
  --muted:#9FB2CE;
  --muted2:#63769B;
  --orange:#FF8A1E;
  --orange-dim:#3A2415;
  --blue:#3E8EF7;
  --blue-dim:#0F2A4E;
  --green:#3DBE7A;
  --green-dim:#0F2E22;
  --gold:#F4B942;
  --gold-dim:#332A10;
  --red:#F0685F;
  --red-dim:#3A1A1A;
  --purple:#A67BEC;
  --purple-dim:#251A3D;
  --radius:10px;
  --radius-lg:16px;
  --ease-out:cubic-bezier(.16,.84,.44,1);
  --ease-standard:cubic-bezier(.4,0,.2,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --dur-fast:120ms;
  --dur-base:200ms;
  --dur-slow:360ms;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,Arial,sans-serif;
  font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button,input,select,textarea{font-family:inherit;font-size:15px;color:var(--text);}
button{cursor:pointer;}
a{color:var(--blue);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#2C333D;border-radius:8px;}

/* ── Layout shell ── */
#app{display:flex;height:100vh;height:100dvh;overflow:hidden;}

/* ── Sidebar ── */
#sidebar{
  width:250px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow-y:auto;transition:transform .25s ease;
}
.brand{padding:18px 16px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);}
.brand svg{flex-shrink:0;}
.brand-name{font-weight:800;font-size:15px;letter-spacing:.4px;text-transform:uppercase;}
.brand-sub{font-size:10.5px;color:var(--muted);margin-top:1px;letter-spacing:.4px;text-transform:uppercase;}

.obra-picker{padding:12px 14px;border-bottom:1px solid var(--border);}
.obra-picker label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted2);margin-bottom:6px;font-weight:700;}
.obra-picker select{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:9px 10px;color:var(--text);}

nav.menu{flex:1;padding:10px 8px 20px;}
.menu-group{margin-bottom:4px;}
.menu-group-label{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted2);font-weight:800;padding:14px 10px 6px;}
.menu-item{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;margin:1px 0;
  color:var(--muted);cursor:pointer;border-left:3px solid transparent;font-size:14px;font-weight:600;
  background:none;border-top:none;border-right:none;border-bottom:none;width:100%;text-align:left;
}
.menu-item:hover{background:var(--panel);color:var(--text);}
.menu-item.active{background:var(--panel2);color:var(--text);}
.menu-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.menu-item .ic{width:17px;height:17px;flex-shrink:0;opacity:.85;}
.menu-item.active{border-left-color:var(--accent,var(--orange));}

/* ── Topbar ── */
#topbar{
  height:56px;flex-shrink:0;background:var(--bg2);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:0 16px;
}
#menuToggle{display:none;background:none;border:1px solid var(--border);border-radius:8px;padding:7px 9px;color:var(--text);}
#topbar h1{font-size:16px;font-weight:800;margin:0;flex:1;}
.topbar-actions{display:flex;gap:8px;}
.icon-btn{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:7px 9px;color:var(--muted);}
.icon-btn:hover{color:var(--text);border-color:var(--muted2);}

/* ── Main ── */
#main{flex:1;overflow-y:auto;padding:20px;background:var(--bg);}
.container{max-width:1100px;margin:0 auto;}

/* ── Cards / panels ── */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:14px;}
.card-title{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:0 0 12px;}
.grid{display:grid;gap:12px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:1fr 1fr 1fr;}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:760px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr 1fr;}}
@media(max-width:520px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
.stat .n{font-size:24px;font-weight:800;}
.stat .l{font-size:12px;color:var(--muted);margin-top:2px;}
.stat.accent-orange{border-left:3px solid var(--orange);}
.stat.accent-blue{border-left:3px solid var(--blue);}
.stat.accent-green{border-left:3px solid var(--green);}
.stat.accent-gold{border-left:3px solid var(--gold);}
.stat.accent-red{border-left:3px solid var(--red);}
.stat.accent-purple{border-left:3px solid var(--purple);}

/* ── Hero (identidade visual) ── */
.hero{
  position:relative;border-radius:var(--radius-lg);overflow:hidden;margin-bottom:16px;
  min-height:280px;display:flex;flex-direction:column;justify-content:flex-end;
  padding:26px 26px 24px;
  background:
    linear-gradient(180deg, rgba(10,21,38,.15) 0%, rgba(10,21,38,.55) 55%, rgba(10,21,38,.96) 100%),
    linear-gradient(115deg, #E8A96A 0%, #C97B63 22%, #6E5B7E 46%, #2C3B5C 68%, #0E1E36 100%);
}
.hero::before{
  content:'';position:absolute;left:0;right:0;bottom:0;height:38%;
  background-image:
    linear-gradient(0deg, var(--bg) 0%, rgba(10,21,38,0) 100%),
    repeating-linear-gradient(90deg, transparent 0 38px, rgba(10,21,38,.55) 38px 42px);
  clip-path:polygon(0% 100%,0% 55%,4% 55%,4% 40%,9% 40%,9% 60%,14% 60%,14% 30%,15% 30%,15% 15%,17% 15%,17% 30%,22% 30%,22% 50%,28% 50%,28% 20%,29% 5%,30% 20%,31% 45%,37% 45%,37% 62%,44% 62%,44% 35%,50% 35%,50% 55%,57% 55%,57% 25%,58% 10%,59% 25%,60% 48%,67% 48%,67% 33%,73% 33%,73% 58%,80% 58%,80% 42%,86% 42%,86% 20%,87% 8%,88% 20%,89% 45%,95% 45%,95% 60%,100% 60%,100% 100%);
  opacity:.9;pointer-events:none;
}
.hero-top{display:flex;align-items:center;gap:10px;position:relative;z-index:2;margin-bottom:auto;}
.hero-logo-name{font-weight:800;font-size:14px;letter-spacing:.5px;text-transform:uppercase;color:#fff;}
.hero-logo-sub{font-size:10.5px;color:rgba(255,255,255,.7);letter-spacing:.5px;text-transform:uppercase;}
.hero-body{position:relative;z-index:2;max-width:640px;}
.hero-eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--orange);font-weight:800;margin-bottom:10px;}
.hero-title{font-size:34px;line-height:1.08;font-weight:800;color:#fff;margin:0;}
.hero-title em{display:block;font-style:italic;font-weight:600;color:#FCD9AD;}
.hero-desc{color:rgba(255,255,255,.82);font-size:14px;margin:12px 0 18px;max-width:480px;}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;}
.pill{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:30px;font-weight:800;font-size:13px;border:1px solid transparent;}
.pill-primary{background:var(--orange);color:#241203;}
.pill-outline{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.35);color:#fff;}
.pill-outline .dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;}
@media(max-width:640px){.hero{min-height:230px;padding:20px 18px 20px;}.hero-title{font-size:26px;}}

/* ── Highlight banner (estilo "Registro de Presença") ── */
.hl-banner{
  display:flex;align-items:center;gap:14px;background:var(--panel2);
  border-left:4px solid var(--orange);border-radius:var(--radius-lg);
  padding:16px 18px;margin-bottom:16px;
}
.hl-icon{width:38px;height:38px;border-radius:10px;background:rgba(255,138,30,.15);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--orange);}
.hl-icon svg{width:20px;height:20px;}
.hl-text{flex:1;min-width:0;}
.hl-eyebrow{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700;}
.hl-title{font-size:18px;font-weight:800;margin:1px 0 2px;}
.hl-sub{font-size:12.5px;color:var(--muted);}
.hl-arrow{width:38px;height:38px;border-radius:50%;background:var(--orange);color:#241203;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;border:none;}

/* ── Module grid (estilo cards de navegação) ── */
.mod-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
@media(max-width:760px){.mod-grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:480px){.mod-grid{grid-template-columns:repeat(2,1fr);}}
.mod-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 12px;
  text-align:left;color:var(--text);display:flex;flex-direction:column;gap:14px;min-height:78px;}
.mod-card:hover{border-color:var(--orange);background:var(--panel2);}
.mod-card .ic{width:19px;height:19px;color:var(--orange);}
.mod-card .lbl{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:var(--text);}

/* ── Login screen ── */
#loginScreen{
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:flex-end;
  padding:26px 20px 40px;position:relative;overflow:hidden;
  background:
    linear-gradient(180deg, rgba(10,21,38,.15) 0%, rgba(10,21,38,.6) 55%, rgba(10,21,38,.98) 100%),
    linear-gradient(115deg, #E8A96A 0%, #C97B63 22%, #6E5B7E 46%, #2C3B5C 68%, #0E1E36 100%);
}
#loginScreen::before{
  content:'';position:absolute;left:0;right:0;bottom:0;height:34%;
  background-image:
    linear-gradient(0deg, var(--bg) 0%, rgba(10,21,38,0) 100%),
    repeating-linear-gradient(90deg, transparent 0 38px, rgba(10,21,38,.55) 38px 42px);
  clip-path:polygon(0% 100%,0% 55%,4% 55%,4% 40%,9% 40%,9% 60%,14% 60%,14% 30%,15% 30%,15% 15%,17% 15%,17% 30%,22% 30%,22% 50%,28% 50%,28% 20%,29% 5%,30% 20%,31% 45%,37% 45%,37% 62%,44% 62%,44% 35%,50% 35%,50% 55%,57% 55%,57% 25%,58% 10%,59% 25%,60% 48%,67% 48%,67% 33%,73% 33%,73% 58%,80% 58%,80% 42%,86% 42%,86% 20%,87% 8%,88% 20%,89% 45%,95% 45%,95% 60%,100% 60%,100% 100%);
  opacity:.9;pointer-events:none;
}
.login-top{display:flex;align-items:center;gap:10px;position:relative;z-index:2;margin-bottom:auto;}
.login-body{position:relative;z-index:2;max-width:420px;width:100%;margin:0 auto;}
.login-card{
  margin-top:20px;background:rgba(14,30,54,.75);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.14);border-radius:var(--radius-lg);padding:20px;
}
.login-card .field label{color:rgba(255,255,255,.75);}
.login-card .field input{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff;}
.login-card .field input::placeholder{color:rgba(255,255,255,.4);}
.login-error{background:var(--red-dim);border:1px solid var(--red);color:#ffb3ae;border-radius:8px;padding:8px 12px;font-size:12.5px;margin-bottom:12px;}
.login-hint{margin-top:14px;text-align:center;font-size:11.5px;color:rgba(255,255,255,.55);}
@media(max-width:640px){#loginScreen{padding:20px 16px 30px;}}

/* ── User chip (topbar) ── */
.user-chip{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--border);
  border-radius:20px;padding:6px 12px 6px 10px;font-size:12.5px;font-weight:700;cursor:pointer;}
.user-chip:hover{border-color:var(--muted2);}
.user-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--green);}
@media(max-width:520px){.user-chip span:not(.dot){display:none;}}

/* ── Obras: grid de cards com progresso ── */
.obra-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
.obra-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;
  display:flex;flex-direction:column;gap:10px;border-left:4px solid var(--muted2);}
.obra-card.st-em_andamento{border-left-color:var(--green);}
.obra-card.st-planejamento{border-left-color:var(--muted2);}
.obra-card.st-pausada{border-left-color:var(--gold);}
.obra-card.st-concluida{border-left-color:var(--blue);}
.obra-card.st-cancelada{border-left-color:var(--red);}
.obra-card.is-active{outline:2px solid var(--orange);outline-offset:-1px;}
.obra-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.obra-card-name{font-weight:800;font-size:15px;line-height:1.25;}
.obra-card-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.progress-bar{height:7px;border-radius:6px;background:var(--panel2);overflow:hidden;}
.progress-fill{height:100%;background:var(--orange);border-radius:6px;transition:width .3s ease;}
.obra-card-metrics{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);}
.obra-card-foot{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:8px;border-top:1px solid var(--border);}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.filter-chip{padding:6px 13px;border-radius:20px;border:1px solid var(--border);background:var(--panel);
  color:var(--muted);font-size:12.5px;font-weight:700;}
.filter-chip.active{background:var(--orange);border-color:var(--orange);color:#241203;}

/* ── Forms ── */
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;}
.field input,.field select,.field textarea{
  width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;
  padding:9px 11px;color:var(--text);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--orange);}
.field textarea{resize:vertical;min-height:70px;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}

/* ── Buttons ── */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:8px;
  border:1px solid var(--border);background:var(--panel2);color:var(--text);font-weight:700;font-size:13.5px;
}
.btn:hover{border-color:var(--muted2);}
.btn-primary{background:var(--orange);border-color:var(--orange);color:#1A0E04;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-ghost{background:none;border-color:transparent;color:var(--muted);}
.btn-ghost:hover{color:var(--text);background:var(--panel);}
.btn-danger{background:var(--red-dim);border-color:var(--red);color:var(--red);}
.btn-sm{padding:6px 10px;font-size:12.5px;}
.btn-block{width:100%;justify-content:center;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}

/* ── Tables ── */
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted2);
   padding:8px 10px;border-bottom:1px solid var(--border);font-weight:800;}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--panel2);}
.table-wrap{overflow-x:auto;}
.row-actions{display:flex;gap:6px;justify-content:flex-end;}
.empty-state{text-align:center;padding:36px 16px;color:var(--muted);}
.empty-state .big{font-size:32px;margin-bottom:8px;}

/* ── Badges ── */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:.2px;}
.badge-orange{background:var(--orange-dim);color:var(--orange);}
.badge-blue{background:var(--blue-dim);color:var(--blue);}
.badge-green{background:var(--green-dim);color:var(--green);}
.badge-gold{background:var(--gold-dim);color:var(--gold);}
.badge-red{background:var(--red-dim);color:var(--red);}
.badge-purple{background:var(--purple-dim);color:var(--purple);}
.badge-muted{background:var(--panel2);color:var(--muted);}

/* ── Modal ── */
#modalOverlay{
  position:fixed;inset:0;background:rgba(6,8,10,.65);display:none;
  align-items:flex-start;justify-content:center;z-index:200;padding:26px 14px;overflow-y:auto;
}
#modalOverlay.open{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);
  width:100%;max-width:560px;padding:20px;margin:auto;}
.modal-wide{max-width:820px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.modal-head h3{margin:0;font-size:16px;font-weight:800;}
.modal-close{background:none;border:none;color:var(--muted);font-size:20px;line-height:1;padding:4px;}

/* ── Toast ── */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(8px);
  background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 16px;
  font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s ease;z-index:300;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── Kanban ── */
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start;}
@media(max-width:760px){.kanban{grid-template-columns:1fr;}}
.kcol{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:10px;min-height:80px;}
.kcol-head{display:flex;justify-content:space-between;align-items:center;padding:6px 6px 10px;font-size:12px;font-weight:800;text-transform:uppercase;color:var(--muted);}
.kcard{background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:10px;margin-bottom:8px;cursor:grab;}
.kcard.dragging{opacity:.4;}
.kcard-atrasada{border-color:var(--red);box-shadow:inset 3px 0 0 var(--red);}
.kcard-title{font-weight:700;font-size:13.5px;margin-bottom:5px;}
.kcard-meta{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--muted);}
.kcol.dragover{outline:2px dashed var(--orange);outline-offset:-4px;}

/* ── Cronograma (Gantt) ── */
.gantt-wrap{overflow-x:auto;}
.gantt-header,.gantt-row{display:flex;align-items:stretch;min-width:600px;}
.gantt-label{width:170px;flex:none;padding:8px 8px 8px 0;font-size:12px;color:var(--text);display:flex;align-items:center;gap:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gantt-track{flex:1;position:relative;border-left:1px solid var(--border);min-height:34px;}
.gantt-row{border-top:1px solid var(--border);}
.gantt-row:first-child{border-top:none;}
.gantt-tick{position:absolute;top:0;font-size:10px;color:var(--muted2);transform:translateX(-50%);white-space:nowrap;}
.gantt-bar{position:absolute;top:6px;bottom:6px;border-radius:6px;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;padding:0 8px;overflow:hidden;white-space:nowrap;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.gantt-today{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--red);opacity:.7;}

/* ── Planta Técnica (editor CAD simplificado) ── */
.cad-toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.cad-tool{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:7px 10px;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;}
.cad-tool.active{background:var(--orange);color:#1a1207;border-color:var(--orange);}
.cad-canvas-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px;background:#0c1526;}
#cadCanvas{display:block;cursor:crosshair;touch-action:none;}
.cad-legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}

/* ── Tabs (within page) ── */
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:0;}
.subtab{padding:9px 13px;border-radius:8px 8px 0 0;background:none;border:none;color:var(--muted);font-weight:700;font-size:13px;border-bottom:2px solid transparent;}
.subtab.active{color:var(--text);border-bottom-color:var(--orange);}

/* ── Misc ── */
.hint{font-size:12px;color:var(--muted2);margin-top:4px;}
.divider{height:1px;background:var(--border);margin:14px 0;}
.total-line{display:flex;justify-content:space-between;font-weight:800;font-size:15px;padding-top:10px;border-top:1px solid var(--border);margin-top:6px;}
.file-chip{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:6px;}
.file-chip .fname{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.calc-result{background:var(--blue-dim);border:1px solid var(--blue);border-radius:9px;padding:12px 14px;margin-top:12px;}
.calc-result b{color:var(--blue);}
.warn-box{background:var(--gold-dim);border:1px solid var(--gold);border-radius:9px;padding:10px 12px;font-size:12.5px;color:var(--gold);margin-top:10px;}

@media(max-width:860px){
  #sidebar{position:fixed;left:0;top:0;bottom:0;z-index:150;transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);}
  #menuToggle{display:inline-flex;}
  #main{padding:14px;}
}

@media print{
  #sidebar,#topbar,.no-print{display:none!important;}
  #main{overflow:visible;padding:0;}
  body{background:#fff;color:#000;}
  .card{border:1px solid #ccc;background:#fff;}
}

/* ══════════════════════════════════════════════════════════
   MOVIMENTO & INTERAÇÃO — micro-interações discretas que dão
   resposta tátil às ações (como instrumentos de um painel de
   obra: clique, encaixe, resposta), sem exagero.
   ══════════════════════════════════════════════════════════ */

/* Entrada das páginas: os blocos de conteúdo "assentam" em
   sequência curta ao trocar de módulo, como pranchas colocadas
   sobre a mesa de trabalho. */
@keyframes pageIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
#pageContent > *{ animation: pageIn var(--dur-slow) var(--ease-out) both; }
#pageContent > *:nth-child(1){animation-delay:0ms;}
#pageContent > *:nth-child(2){animation-delay:35ms;}
#pageContent > *:nth-child(3){animation-delay:70ms;}
#pageContent > *:nth-child(4){animation-delay:105ms;}
#pageContent > *:nth-child(n+5){animation-delay:130ms;}

/* Botões: leve elevação no hover, "clique" tátil no press */
.btn{transition:transform var(--dur-fast) var(--ease-standard),box-shadow var(--dur-fast) var(--ease-standard),border-color var(--dur-fast) var(--ease-standard),background-color var(--dur-fast) var(--ease-standard),filter var(--dur-fast) var(--ease-standard);}
.btn:hover{transform:translateY(-1px);}
.btn:active{transform:translateY(0) scale(.96);}
.btn-primary:hover{box-shadow:0 4px 16px rgba(255,138,30,.32);}
.cad-tool,.subtab{transition:transform var(--dur-fast) var(--ease-standard),background var(--dur-fast) var(--ease-standard),color var(--dur-fast) var(--ease-standard),border-color var(--dur-fast) var(--ease-standard);}
.cad-tool:active,.subtab:active{transform:scale(.96);}

/* Itens do menu lateral: deslizam sutilmente e a marcação de
   ativo transiciona em vez de trocar abruptamente */
.menu-item{transition:background var(--dur-fast) var(--ease-standard),color var(--dur-fast) var(--ease-standard),border-left-color var(--dur-base) var(--ease-standard),transform var(--dur-fast) var(--ease-standard);}
.menu-item:hover{transform:translateX(3px);}
.menu-item .ic{transition:transform var(--dur-base) var(--ease-standard);}
.menu-item.active .ic{transform:scale(1.08);}

/* Cartões e itens clicáveis: leve elevação, como se saltassem
   da mesa ao serem apontados */
.card,.stat,.obra-card,.kcard{transition:transform var(--dur-base) var(--ease-standard),box-shadow var(--dur-base) var(--ease-standard),border-color var(--dur-base) var(--ease-standard);}
.obra-card:hover,.stat:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(0,0,0,.28);border-color:var(--muted2);}
.kcard{cursor:grab;}
.kcard:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.25);}
.kcard.dragging{opacity:.45;transform:scale(1.03) rotate(1deg);cursor:grabbing;box-shadow:0 12px 28px rgba(0,0,0,.35);}
.kcol{transition:background var(--dur-fast) var(--ease-standard);}
.kcol.dragover{background:rgba(255,138,30,.05);}

/* Badges/itens tocáveis que alternam estado (ex: status) */
.badge[onclick]{cursor:pointer;transition:transform var(--dur-fast) var(--ease-standard),filter var(--dur-fast) var(--ease-standard);}
.badge[onclick]:hover{filter:brightness(1.15);}
.badge[onclick]:active{transform:scale(.92);}

/* Linhas de tabela: realce suave, não instantâneo */
td{transition:background var(--dur-fast) var(--ease-standard);}

/* Barras do Gantt: destaque ao apontar */
.gantt-bar{transition:filter var(--dur-fast) var(--ease-standard),transform var(--dur-fast) var(--ease-standard);}
.gantt-bar:hover{filter:brightness(1.15);transform:translateY(-1px);}

/* Modal: entra com leve assentamento; fundo esmaece */
@keyframes modalIn{ from{opacity:0; transform:translateY(18px) scale(.96);} to{opacity:1; transform:translateY(0) scale(1);} }
@keyframes overlayIn{ from{opacity:0;} to{opacity:1;} }
#modalOverlay.open{animation:overlayIn .18s var(--ease-standard);}
.modal{animation:modalIn .28s var(--ease-out);}

/* Toast: resposta com leve "mola" ao assentar, reforçando o
   caráter tátil/mecânico do painel */
#toast{transition:opacity .3s var(--ease-standard),transform .38s var(--ease-spring);}

/* Progresso: preenchimento com a mesma curva de assentamento */
.progress-fill{transition:width .4s var(--ease-out);}

/* Sidebar (mobile): abre/fecha com a curva padrão em vez de linear */
#sidebar{transition:transform var(--dur-base) var(--ease-standard);}

/* Respeita preferência do sistema por menos movimento */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:0.001ms!important;animation-iteration-count:1!important;
    transition-duration:0.001ms!important;scroll-behavior:auto!important;
  }
}

<!-- ── Firebase (banco de dados online compartilhado) ── -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-storage-compat.min.js"></script>

<script>
/* ============================================================
   ObraGest — Sistema de Gestão de Obras (Construção/Reforma)
   Dados e documentos salvos em nuvem (Firebase), compartilhados
   automaticamente entre todos os usuários.
   ============================================================ */

/* ── CONFIGURAÇÃO DO FIREBASE ──────────────────────────────────
   Substitua os valores abaixo pelos do SEU projeto Firebase
   (Console Firebase → ⚙️ Configurações do projeto → Seus apps → SDK setup).
   ------------------------------------------------------------- */
const firebaseConfig = {
  apiKey: "AIzaSyBgGBeGbRI5M0zrqMRIZvoD2Sx7xU4xJpA",
  authDomain: "obragestdb.firebaseapp.com",
  projectId: "obragestdb",
  storageBucket: "obragestdb.firebasestorage.app",
  messagingSenderId: "307800389687",
  appId: "1:307800389687:web:5cd73933efc1634e1027b2",
  measurementId: "G-8CK89764G0"
};
firebase.initializeApp(firebaseConfig);
const fbAuth = firebase.auth();
const fbDb = firebase.firestore();
fbDb.settings({ ignoreUndefinedProperties: true });
const fbStorage = firebase.storage();

const DB_KEY = 'obragest_v1';
window.addEventListener('unhandledrejection', function(e){
  const msg = String((e && e.reason && (e.reason.message||e.reason)) || '');
  if(/zombie client id|indexeddb|IndexedDb/i.test(msg)){
    // Erro interno do Firestore ao tentar coordenar abas via IndexedDB em ambientes
    // restritos (ex.: pré-visualização em iframe). Não afeta o funcionamento do app
    // quando aberto numa aba de navegador normal.
    e.preventDefault();
  }
});
const MODULES_META = {
  dashboard:  {label:'Dashboard', group:'', color:'orange'},
  obras:      {label:'Obras', group:'Gestão Geral', color:'orange'},
  documentos: {label:'Documentos & Plantas', group:'Gestão Geral', color:'orange'},
  tarefas:    {label:'Tarefas (Kanban)', group:'Gestão Geral', color:'orange'},
  cronograma: {label:'Cronograma', group:'Gestão Geral', color:'orange'},
  financeiro: {label:'Painel Financeiro', group:'Financeiro', color:'gold'},
  orcamentos: {label:'Orçamentos', group:'Financeiro', color:'gold'},
  propostas:  {label:'Propostas', group:'Financeiro', color:'gold'},
  compras:    {label:'Listas de Compras', group:'Financeiro', color:'gold'},
  fornecedores: {label:'Fornecedores', group:'Financeiro', color:'gold'},
  pagamentos: {label:'Pagamentos', group:'Financeiro', color:'gold'},
  reembolsos: {label:'Reembolsos', group:'Financeiro', color:'gold'},
  rh:         {label:'RH & Equipe', group:'Pessoas', color:'green'},
  presenca:   {label:'Presença & Ponto', group:'Pessoas', color:'green'},
  estrutural: {label:'Estrutural & Fundações', group:'Especialidades Técnicas', color:'blue'},
  eletrica:   {label:'Elétrica', group:'Especialidades Técnicas', color:'blue'},
  eletrotecnica:{label:'Eletrotécnica', group:'Especialidades Técnicas', color:'blue'},
  hidraulica: {label:'Hidráulica', group:'Especialidades Técnicas', color:'blue'},
  civil:      {label:'Civil & Alvenaria', group:'Especialidades Técnicas', color:'blue'},
  audio:      {label:'Áudio & AVL', group:'Especialidades Técnicas', color:'blue'},
  forros:     {label:'Forros & Acabamento', group:'Especialidades Técnicas', color:'blue'},
  marcenaria: {label:'Marcenaria', group:'Especialidades Técnicas', color:'blue'},
  serralheria:{label:'Serralheria', group:'Especialidades Técnicas', color:'blue'},
  decoracao:  {label:'Decoração', group:'Especialidades Técnicas', color:'blue'},
  planos:     {label:'Planos Técnicos', group:'Documentação Técnica', color:'gold'},
  plantaTecnica: {label:'Planta Técnica', group:'Documentação Técnica', color:'gold'},
  jurisprudencia:{label:'Jurisprudência & Direito', group:'Documentação Técnica', color:'purple'},
  relatorio:  {label:'Relatório Geral', group:'Relatórios', color:'orange'},
  config:     {label:'Configurações', group:'Sistema', color:'purple'},
};

/* ── Autenticação ── */
const MASTER_USER = 'obragest';
const MASTER_PASS = '1978';
let CURRENT_USER = null; // {id, usuario, nome, papel}

function defaultDB(){
  return {
    meta:{ currentObraId:null, sessionUserId:null },
    usuarios:[],
    obras:[], documentos:[], orcamentos:[], propostas:[], compras:[],
    pagamentosDiarias:[], pagamentosPropostas:[], liberacoes:[], reembolsos:[],
    rhPessoas:[], rhAlocacoes:[], presencas:[], tarefas:[], fornecedores:[],
    eletrica:[], eletrotecnica:[], hidraulica:[], audio:[], forros:[],
    estrutural:[], civil:[], planos:[], marcenaria:[], serralheria:[], decoracao:[]
  };
}

/* ============================================================
   BANCO DE DADOS ONLINE (Firebase Firestore)
   Cada array do DB acima (exceto "meta") vira uma coleção no
   Firestore. Cada registro é um documento (id = mesmo id local).
   Isso permite que todos os usuários leiam e escrevam os mesmos
   dados em tempo real, com sincronização automática.
   "meta" (obra/sessão selecionada) é só do dispositivo, guardado
   localmente, para não "puxar" a tela de um usuário para outro.
   ============================================================ */
const CLOUD_COLLECTIONS = ['usuarios','obras','documentos','orcamentos','propostas','compras',
  'pagamentosDiarias','pagamentosPropostas','liberacoes','reembolsos','rhPessoas','rhAlocacoes','presencas','tarefas','fornecedores',
  'eletrica','eletrotecnica','hidraulica','audio','forros','estrutural','civil','planos','marcenaria','serralheria','decoracao'];

const META_KEY = 'obragest_meta_v1';
let LAST_SYNCED = {}; // colName -> {id: jsonString}
let CLOUD_READY = false;
let MODAL_OPEN = false;

function loadLocalMeta(){
  try{ return Object.assign({currentObraId:null,sessionUserId:null}, JSON.parse(localStorage.getItem(META_KEY)||'{}')); }
  catch(e){ return {currentObraId:null,sessionUserId:null}; }
}
function saveLocalMeta(){
  localStorage.setItem(META_KEY, JSON.stringify(DB.meta));
}

let DB = defaultDB();
DB.meta = loadLocalMeta();
let STATE = { module: 'dashboard', obraId: DB.meta.currentObraId || null, subtab: {} };

function uid(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function nowISO(){ return new Date().toISOString(); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('pt-BR'); }
function fmtDateHora(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function fmtMoney(v){ v=Number(v)||0; return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* Grava no Firestore só o que realmente mudou em cada coleção desde a
   última sincronização (comparação por id), preservando toda a lógica
   existente do app (que só mexe nos arrays de DB em memória). */
function saveDB(){
  DB.meta.currentObraId = STATE.obraId;
  saveLocalMeta();
  if(!CLOUD_READY) return; // ainda conectando: a 1ª sincronização completa cuidará disso
  CLOUD_COLLECTIONS.forEach(col=>{
    const arr = DB[col]||[];
    const prevMap = LAST_SYNCED[col] || {};
    const curMap = {};
    const writes = [];
    arr.forEach(rec=>{
      if(!rec || !rec.id) return;
      const json = JSON.stringify(rec);
      curMap[rec.id] = json;
      if(prevMap[rec.id] !== json){
        writes.push(fbDb.collection(col).doc(rec.id).set(rec));
      }
    });
    Object.keys(prevMap).forEach(oldId=>{
      if(!(oldId in curMap)) writes.push(fbDb.collection(col).doc(oldId).delete());
    });
    LAST_SYNCED[col] = curMap;
    if(writes.length){
      Promise.all(writes).catch(e=>{ console.error('Erro ao sincronizar '+col, e); toast('⚠️ Falha ao sincronizar dados. Verifique sua conexão.'); });
    }
  });
}

/* Liga um listener em tempo real para cada coleção. Resolve quando a
   primeira leitura de TODAS as coleções chegar (boot inicial). Depois
   disso continua atualizando DB[col] automaticamente sempre que
   qualquer usuário alterar algo. */
function initCloudSync(){
  const boots = CLOUD_COLLECTIONS.map(col=>new Promise(resolve=>{
    let first = true;
    fbDb.collection(col).onSnapshot(snap=>{
      const arr = [];
      const map = {};
      snap.forEach(doc=>{ const data = doc.data(); arr.push(data); map[doc.id] = JSON.stringify(data); });
      DB[col] = arr;
      LAST_SYNCED[col] = map;
      if(first){ first = false; resolve(); }
      else if(CLOUD_READY && !MODAL_OPEN){ renderSidebar(); renderPage(); }
    }, err=>{
      console.error('Erro no listener de '+col, err);
      if(first){ first = false; resolve(); }
      toast('⚠️ Sem conexão com o banco de dados online.');
    });
  }));
  return Promise.all(boots);
}

/* Upload de arquivo/foto para o Firebase Storage. Retorna a URL pública
   (guardada no lugar do antigo dataUrl em base64 — funciona igual em
   <img src> e <a href>, só que agora o arquivo mora na nuvem). */
async function uploadArquivo(file, pasta){
  const path = 'obragest/'+pasta+'/'+uid()+'_'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  const ref = fbStorage.ref().child(path);
  await ref.put(file);
  return await ref.getDownloadURL();
}

/* ============================================================
   ANEXOS VIA LINK EXTERNO (Google Drive, Dropbox, etc.)
   Forma alternativa de anexar fotos/documentos sem depender do
   Firebase Storage: o usuário sobe o arquivo no Google Drive,
   deixa o link como "Qualquer pessoa com o link pode visualizar"
   e cola aqui. Se for um link de arquivo do Drive, geramos a
   miniatura automaticamente.
   ============================================================ */
function driveThumbUrl(url){
  if(!url) return null;
  const m = url.match(/\/d\/([a-zA-Z0-9_-]{15,})/) || url.match(/[?&]id=([a-zA-Z0-9_-]{15,})/);
  return m ? `https://drive.google.com/thumbnail?id=${m[1]}&sz=w400` : null;
}
function isValidHttpUrl(url){ return /^https?:\/\/.+/i.test((url||'').trim()); }
function fotoViewTileHtml(f){
  const src = f.dataUrl || driveThumbUrl(f.link);
  const openUrl = f.link || f.dataUrl || '#';
  return src
    ? `<img src="${src}" style="width:90px;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--border);cursor:pointer;" onclick="window.open('${openUrl}','_blank')">`

/* ============================================================
   AUTENTICAÇÃO (usuário master fixo + usuários adicionais
   com senha SHA-256 + salt, armazenados localmente)
   ============================================================ */
async function sha256Hex(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function randomSalt(){ return uid()+uid(); }
async function hashSenha(senha, salt){ return await sha256Hex(salt+'::'+senha); }

function masterUserObj(){ return {id:'master', usuario:MASTER_USER, nome:'Administrador', papel:'master'}; }

async function handleLogin(e){
  e.preventDefault();
  const usuario = document.getElementById('loginUser').value.trim();
  const senha = document.getElementById('loginPass').value;
  const errBox = document.getElementById('loginError');
  errBox.style.display='none';

  if(usuario===MASTER_USER && senha===MASTER_PASS){
    CURRENT_USER = masterUserObj();
    DB.meta.sessionUserId = 'master'; saveDB();
    showApp(); return false;
  }
  const u = DB.usuarios.find(x=>x.usuario.toLowerCase()===usuario.toLowerCase() && x.ativo!==false);
  if(u){
    const hash = await hashSenha(senha, u.salt);
    if(hash===u.senhaHash){
      CURRENT_USER = u;
      DB.meta.sessionUserId = u.id; saveDB();
      showApp(); return false;
    }
  }
  errBox.textContent = 'Usuário ou senha inválidos.';
  errBox.style.display='block';
  return false;
}
function handleLogout(){
  if(!confirm('Sair do sistema?')) return;
  DB.meta.sessionUserId = null; saveDB();
  CURRENT_USER = null;
  showLogin();
}
function checkSession(){
  const sid = DB.meta.sessionUserId;
  if(!sid) return null;
  if(sid==='master') return masterUserObj();
  return DB.usuarios.find(u=>u.id===sid && u.ativo!==false) || null;
}
function showApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('userChipName').textContent = CURRENT_USER.nome || CURRENT_USER.usuario;
  renderSidebar();
  go('dashboard');
}

  document.getElementById('loginScreen').style.display='flex';
  const f = document.getElementById('loginForm'); if(f) f.reset();
  const err = document.getElementById('loginError'); if(err) err.style.display='none';
}

function renderSidebar(){

    if(key==='dashboard') return;
    (groups[m.group] = groups[m.group]||[]).push(key);
  });
  let html = `
  <div class="brand">
    ${LOGO_SVG(30)}
    <div><div class="brand-name">ObraGest</div><div class="brand-sub">Engenharia &amp; Obras</div></div>
  </div>
  <div class="obra-picker">

      <option value="">— Selecione uma obra —</option>
      ${DB.obras.map(o=>`<option value="${o.id}" ${o.id===STATE.obraId?'selected':''}>${esc(o.nome)}</option>`).join('')}
    </select>

    <button class="menu-item ${STATE.module==='dashboard'?'active':''}" style="--accent:#FF7A1A" onclick="go('dashboard')">${ICONS.dashboard}Dashboard</button>
  `;
  Object.entries(groups).forEach(([g,keys])=>{

      const m = MODULES_META[key];
      const accent = {orange:'#FF7A1A',gold:'#F4B942',green:'#3DBE64',blue:'#2F80ED'}[m.color];
      html += `<button class="menu-item ${STATE.module===key?'active':''}" style="--accent:${accent}" onclick="go('${key}')">${ICONS[key]||''}${m.label}</button>`;
    });
  });
  html += `</nav>`;
  document.getElementById('sidebar').innerHTML = html;
}

      ${areaTotal?`<div class="obra-card-sub">📐 ${areaTotal.toLocaleString('pt-BR')} m² registrados (${(o.comodos||[]).length} ambiente${(o.comodos||[]).length===1?'':'s'})</div>`:''}
      <div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;"></div></div>

      </div>
      <div class="obra-card-metrics">
        <span>Orçado: <b style="color:var(--text);">${fmtMoney(orcObra)}</b></span>
        <span>Contrato: <b style="color:var(--text);">${fmtMoney(o.valorContrato)}</b></span>
      </div>
      <div class="obra-card-foot">
        <button class="btn btn-sm ${isActive?'btn-primary':''}" onclick="setObra('${o.id}');go('dashboard')">${isActive?'✓ Ativa':'Ativar'}</button>

      <div class="stat accent-blue"><div class="n">${concluidas}</div><div class="l">Concluídas</div></div>
      <div class="stat accent-gold"><div class="n">${fmtMoney(valorTotalContratos)}</div><div class="l">Valor total em contratos</div></div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;">

        <button class="btn btn-primary btn-sm" onclick="openObraForm()">+ Nova obra</button>

function renderComodosObraBlock(){

function addComodoObra(){

function renderFotosObraBlock(tipo){
  const arr = (window._obraFotos && window._obraFotos[tipo]) || [];
  const thumbs = arr.map((f,idx)=>fotoTileHtml(f, `removeFotoObra('${tipo}',${idx})`)).join('');
  return `
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;">${thumbs}</div>
    ${arr.length < 20 ? `<input type="file" accept="image/*" multiple capture="environment" onchange="addFotosObra(event,'${tipo}')">` : `<div class="hint">Limite de 20 fotos atingido.</div>`}
    <div class="hint">${arr.length}/20 fotos</div>
    ${arr.length < 20 ? linkAnexoInputHtml('obraFotoLink_'+tipo, `addFotoLinkObra('${tipo}')`) : ''}
  `;
}
function addFotoLinkObra(tipo){
  const inp = document.getElementById('obraFotoLink_'+tipo);
  const url = (inp.value||'').trim();
  if(!isValidHttpUrl(url)){ toast('Cole um link válido (começando com http:// ou https://).'); return; }
  window._obraFotos[tipo].push({link:url, nome:'Link anexado'});
  refreshFotosObraUI(tipo);
}
function addFotosObra(e, tipo){
  const arr = window._obraFotos[tipo];
  const files = Array.from(e.target.files||[]);
  const vagas = 20 - arr.length;
  if(vagas<=0){ toast('Máximo de 20 fotos.'); e.target.value=''; return; }
  const aceitar = files.slice(0, vagas);
  if(files.length > vagas) toast('Apenas '+vagas+' foto(s) adicionada(s) — limite de 20.');
  let pendentes = aceitar.length;
  if(!pendentes){ e.target.value=''; return; }
  aceitar.forEach(file=>{
    if(!/^image\//.test(file.type)){ toast('Envie apenas imagens.'); pendentes--; if(pendentes<=0) refreshFotosObraUI(tipo); return; }
    if(file.size > 8*1024*1024){ toast('Imagem muito grande (limite 8MB): '+file.name); pendentes--; if(pendentes<=0) refreshFotosObraUI(tipo); return; }
    uploadArquivo(file, 'obras').then(url=>{
      arr.push({dataUrl:url, nome:file.name});
      pendentes--;
      if(pendentes<=0) refreshFotosObraUI(tipo);
    }).catch(err=>{ console.error(err); toast('⚠️ Falha ao enviar foto: '+file.name); pendentes--; if(pendentes<=0) refreshFotosObraUI(tipo); });
  });
  e.target.value='';
}
function removeFotoObra(tipo, idx){
  window._obraFotos[tipo].splice(idx,1);
  refreshFotosObraUI(tipo);
}

/* Planta esquemática (diagrama de blocagem de espaços) — não é uma planta
   técnica em escala real, apenas uma representação visual proporcional das
   metragens cadastradas em cada obra, inspirada em diagramas de estudo de
   layout usados antes de se desenhar a planta definitiva no AutoCAD. */
function viewPlantaObra(id){
  const o = DB.obras.find(x=>x.id===id);
  if(!o) return;
  const comodos = (o.comodos||[]).filter(c=>c.area && Number(c.area)>0);
  if(!comodos.length){
    openModal(`
      <div class="modal-head"><h3>Planta esquemática — ${esc(o.nome)}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
      <p class="hint">Nenhum cômodo com metragem cadastrada ainda. Edite a obra e adicione cômodos com m² para gerar o esboço.</p>
      <div class="btn-row"><button type="button" class="btn btn-primary" onclick="openObraForm('${id}')">Editar obra</button><button type="button" class="btn" onclick="closeModal()">Fechar</button></div>
    `, true);
    return;
  }
  const areas = comodos.map(c=>Number(c.area));
  const maxArea = Math.max(...areas);
  const areaTotal = areas.reduce((s,a)=>s+a,0);
  const BASE = 130;
  const TIPO_COR = {'Reforma':'#F4B942','Construção':'#2F80ED','Modificação':'#3DBE64'};
  const boxes = comodos.map(c=>{
    const side = Math.max(50, Math.round(BASE * Math.sqrt(Number(c.area)/maxArea)));
    const cor = TIPO_COR[c.tipo] || '#7a8699';
    return `<div style="width:${side}px;height:${side}px;background:${cor}22;border:2px solid ${cor};border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px;overflow:hidden;">
      <div style="font-size:11px;font-weight:700;color:var(--text);line-height:1.2;">${esc(c.nome)}</div>
      <div style="font-size:10px;color:var(--muted);margin-top:2px;">${Number(c.area).toLocaleString('pt-BR')} m²</div>
    </div>`;
  }).join('');
  openModal(`
    <div class="modal-head"><h3>Planta esquemática — ${esc(o.nome)}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="hint" style="margin-bottom:10px;">Esboço de blocagem de espaços (o tamanho de cada bloco é proporcional à metragem informada — não é uma planta técnica em escala). 🟨 Reforma · 🟦 Construção · 🟩 Modificação</div>
    <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:12px;background:var(--panel2);border-radius:10px;border:1px solid var(--border);">${boxes}</div>
    <p class="hint" style="margin-top:10px;">Área total: <b>${areaTotal.toLocaleString('pt-BR')} m²</b> em ${comodos.length} ambiente(s).</p>
    <div class="btn-row">
      <button type="button" class="btn btn-primary" onclick="openObraForm('${id}')">Editar cômodos</button>
      <button type="button" class="btn" onclick="closeModal()">Fechar</button>
    </div>
  `, true);
}
function saveObra(e,id){
  e.preventDefault();
  const f = new FormData(e.target);
  const data = Object.fromEntries(f.entries());
  data.fotos = (window._obraFotos && window._obraFotos.geral) || [];
  data.comodos = (window._obraComodos || []).filter(c=>c.nome && c.nome.trim());
  if(id){
    Object.assign(DB.obras.find(o=>o.id===id), data);
  } else {
    data.id = uid(); data.criadoEm = nowISO();
    DB.obras.push(data);
    if(!STATE.obraId) STATE.obraId = data.id;
  }
  saveDB(); closeModal(); toast('Obra salva.'); window._obraFotos=null; window._obraComodos=null; renderSidebar(); go('obras');
}
function deleteObra(id){
  if(!confirm('Excluir esta obra e todos os dados vinculados a ela?')) return;
  DB.obras = DB.obras.filter(o=>o.id!==id);
  ['documentos','orcamentos','propostas','compras','rhAlocacoes','tarefas','eletrica','eletrotecnica','hidraulica','audio','forros','pagamentosDiarias','pagamentosPropostas','liberacoes','reembolsos','marcenaria','serralheria','decoracao'].forEach(k=>{
    DB[k] = DB[k].filter(x=>x.obraId!==id);
  });
  if(STATE.obraId===id) STATE.obraId=null;
  saveDB(); toast('Obra excluída.'); renderSidebar(); go('obras');
}

        <label>Arquivo ${id?'(envie um novo para substituir o atual)':'(opcional)'}</label>

      </div>
      <div class="field"><label>Ou link externo (Drive, etc.)</label><input name="link" value="${esc(d.link||'')}" placeholder="https://..."></div>
      <div class="btn-row">
        <button type="submit" class="btn btn-primary">Salvar</button>
        <button type="button" class="btn" onclick="closeModal()">Cancelar</button>
        ${id?`<button type="button" class="btn btn-danger" onclick="deleteDoc('${id}')">Excluir</button>`:''}
      </div>
    </form>
  `);
}
function saveDoc(e,id){
  e.preventDefault();
  const f = new FormData(e.target);
  const file = f.get('arquivo');
  const finish = (dataUrl,manteveArquivoAntigo)=>{
    if(id){
      const d = DB.documentos.find(x=>x.id===id);
      d.categoria = f.get('categoria'); d.nome = f.get('nome'); d.link = f.get('link')||'';
      if(!manteveArquivoAntigo) d.dataUrl = dataUrl||'';
      d.editadoEm = nowISO();
    } else {
      DB.documentos.push({id:uid(), obraId:STATE.obraId, categoria:f.get('categoria'), nome:f.get('nome'),
        link:f.get('link')||'', dataUrl:dataUrl||'', dataUpload:nowISO()});
    }
    saveDB(); closeModal(); toast('Documento salvo.'); go('documentos');
  };
  if(file && file.size){
    if(file.size > 15*1024*1024){ toast('Arquivo muito grande (limite 15MB). Use um link externo.'); return; }
    toast('Enviando arquivo…');
    uploadArquivo(file, 'documentos').then(url=>finish(url, false)).catch(err=>{ console.error(err); toast('⚠️ Falha ao enviar arquivo.'); });
  } else {
    finish(null, !!id); // ao editar sem novo arquivo, mantém o dataUrl existente
  }
}
function deleteDoc(id){
  DB.documentos = DB.documentos.filter(d=>d.id!==id);
  saveDB(); closeModal(); toast('Documento removido.'); go('documentos');
}

/* ============================================================
   TAREFAS (KANBAN) — com sincronia entre módulos
   ============================================================ */
const TAREFA_AREAS = ['Geral','Elétrica','Hidráulica','Eletrotécnica','Áudio','Forros','Estrutural','Acabamento','Marcenaria','Serralheria','Decoração','RH','Compras'];
const KSTATUS = [['a_fazer','A Fazer'],['fazendo','Em Execução'],['concluido','Concluído']];

/* Módulos cujos itens podem virar/ser sincronizados com uma tarefa */
const SYNC_MODULES = {
  compras:      {doneField:'status', doneValue:'comprado', openValue:'pendente', kind:'select', area:'Compras'},
  orcamentos:   {doneField:'executado', doneValue:'1', openValue:'', kind:'bool', area:'Geral'},
  estrutural:   {doneField:'status', doneValue:'concluido', openValue:'pendente', kind:'select', area:'Estrutural'},
  eletrica:     {doneField:'status', doneValue:'concluido', openValue:'pendente', kind:'select', area:'Elétrica'},
  eletrotecnica:{doneField:'status', doneValue:'concluido', openValue:'pendente', kind:'select', area:'Eletrotécnica'},
  hidraulica:   {doneField:'status', doneValue:'concluido', openValue:'pendente', kind:'select', area:'Hidráulica'},
  civil:        {doneField:'status', doneValue:'concluido', openValue:'pendente', kind:'select', area:'Acabamento'},
  audio:        {doneField:'status', doneValue:'concluido', openValue:'pendente', kind:'select', area:'Áudio'},
  forros:       {doneField:'status', doneValue:'concluido', openValue:'pendente', kind:'select', area:'Forros'},
  marcenaria:   {doneField:'status', doneValue:'concluido', openValue:'pendente', kind:'select', area:'Marcenaria'},
  serralheria:  {doneField:'status', doneValue:'concluido', openValue:'pendente', kind:'select', area:'Serralheria'},
  decoracao:    {doneField:'status', doneValue:'concluido', openValue:'pendente', kind:'select', area:'Decoração'},
};
function isItemDone(modulo,item){
  const cfg = SYNC_MODULES[modulo]; if(!cfg||!item) return false;
  return cfg.kind==='bool' ? !!item[cfg.doneField] : item[cfg.doneField]===cfg.doneValue;
}
function setItemDone(modulo,itemId,done){
  const cfg = SYNC_MODULES[modulo]; if(!cfg) return;
  const item = (DB[modulo]||[]).find(x=>x.id===itemId); if(!item) return;
  item[cfg.doneField] = cfg.kind==='bool' ? (done?'1':'') : (done?cfg.doneValue:cfg.openValue);
  if(modulo==='compras') item.dataCompra = done ? nowISO() : '';
}
function findLinkedTarefa(modulo,itemId){
  return DB.tarefas.find(t=>t.origemModulo===modulo && t.origemId===itemId);
}
/* Chamado quando um item de outro módulo muda de status (ex: compra marcada) → reflete na tarefa vinculada */
function syncTarefaFromOrigem(modulo,itemId,done){
  const t = findLinkedTarefa(modulo,itemId);
  if(t){ t.status = done ? 'concluido' : 'a_fazer'; }
}
/* Chamado quando a tarefa muda de status → reflete no item de origem (outro módulo) */
function syncOrigemFromTarefa(t){
  if(t && t.origemModulo && t.origemId){ setItemDone(t.origemModulo, t.origemId, t.status==='concluido'); }
}
function criarOuAbrirTarefaVinculada(modulo,itemId,tituloPadrao){
  const existing = findLinkedTarefa(modulo,itemId);
  if(existing){ openTarefaForm(existing.id); return; }
  openTarefaForm(null, {titulo:tituloPadrao, area:(SYNC_MODULES[modulo]||{}).area||'Geral', origemModulo:modulo, origemId:itemId});
}
function origemBadge(t){

  return `<span class="badge badge-purple" onclick="event.stopPropagation();go('${t.origemModulo}')" style="cursor:pointer;" title="Ir para ${m?m.label:t.origemModulo}">🔗 ${m?m.label:t.origemModulo}</span>`;
}

/* ============================================================
   CRONOGRAMA (Gantt) — visão de linha do tempo das tarefas,
   inspirada no MS Project.
   ============================================================ */
function renderCronograma(){
  return requireObra(()=>{
    const tarefas = DB.tarefas.filter(t=>t.obraId===STATE.obraId && (t.dataInicio || t.dataFim || t.prazo));
    if(!tarefas.length){
      return `<div class="card"><div class="empty-state"><div class="big">📅</div>
        <p>Nenhuma tarefa com datas cadastradas ainda.<br>Defina "Data de início"/"Data de fim" (ou um prazo) nas tarefas para elas aparecerem no cronograma.</p>
        <button class="btn btn-primary" onclick="go('tarefas')">Ir para Tarefas</button>
      </div></div>`;
    }
    const norm = tarefas.map(t=>{
      const di = t.dataInicio ? t.dataInicio.slice(0,10) : (t.dataFim ? t.dataFim.slice(0,10) : t.prazo.slice(0,10));
      const df = t.dataFim ? t.dataFim.slice(0,10) : (t.prazo ? t.prazo.slice(0,10) : di);
      let ini = new Date(di+'T00:00:00'), fim = new Date(df+'T00:00:00');
      if(ini>fim){ const tmp=ini; ini=fim; fim=tmp; }
      return {t, ini, fim};
    }).sort((a,b)=>a.ini-b.ini);

    let min = new Date(Math.min(...norm.map(n=>n.ini.getTime())));
    let max = new Date(Math.max(...norm.map(n=>n.fim.getTime())));
    min.setDate(min.getDate()-1); max.setDate(max.getDate()+2);
    const totalDias = Math.max(1, Math.round((max-min)/86400000));
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const hojePct = ((hoje-min)/86400000/totalDias*100);
    const hojeVisivel = hojePct>=0 && hojePct<=100;

    const semanas = [];
    for(let d=new Date(min); d<=max; d.setDate(d.getDate()+7)){
      const pct = (d-min)/86400000/totalDias*100;
      semanas.push(`<div class="gantt-tick" style="left:${pct}%;">${d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</div>`);
    }

    const STATUS_COLOR = {a_fazer:'#7a8699', em_andamento:'#2F80ED', concluido:'#3DBE64'};
    const linhas = norm.map(({t,ini,fim})=>{
      const left = (ini-min)/86400000/totalDias*100;
      const width = Math.max(1.5, (fim-ini)/86400000/totalDias*100 + (1/totalDias*100));
      const atrasada = t.status!=='concluido' && fim < hoje;
      const cor = atrasada ? '#E5484D' : (STATUS_COLOR[t.status]||'#7a8699');
      return `
      <div class="gantt-row">
        <div class="gantt-label" title="${esc(t.titulo)}"><span class="badge badge-blue" style="flex:none;">${esc(t.area||'Geral')}</span>${esc(t.titulo)}</div>
        <div class="gantt-track">
          ${hojeVisivel?`<div class="gantt-today" style="left:${hojePct}%;"></div>`:''}
          <div class="gantt-bar" style="left:${left}%;width:${width}%;background:${cor};" onclick="openTarefaForm('${t.id}')" title="${esc(t.titulo)} — ${fmtDate(t.dataInicio||t.prazo)} → ${fmtDate(t.dataFim||t.prazo)}${atrasada?' (ATRASADA)':''}">${width>7?esc(t.titulo):''}</div>
        </div>
      </div>`;
    }).join('');

    const nAtrasadas = norm.filter(({t,fim})=>t.status!=='concluido' && fim<hoje).length;

    return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
        <div class="card-title" style="margin:0;">Cronograma — ${esc(currentObra().nome)}</div>
        <button class="btn btn-primary btn-sm" onclick="go('tarefas')">+ Gerenciar tarefas</button>
      </div>
      ${nAtrasadas?`<div class="hint" style="color:var(--red);margin-bottom:10px;">🔴 ${nAtrasadas} tarefa(s) atrasada(s).</div>`:''}
      <div class="hint" style="margin-bottom:10px;">🔵 A fazer/em andamento · 🟢 concluída · 🔴 atrasada · linha tracejada vermelha = hoje</div>
      <div class="gantt-wrap">
        <div class="gantt-header"><div class="gantt-label"></div><div class="gantt-track" style="min-height:22px;">${semanas.join('')}</div></div>
        ${linhas}
      </div>
    </div>`;
  });
}

function renderChecklistTarefaBlock(){
  const arr = window._tarefaChecklist || [];
  if(!arr.length) return `<div class="hint">Nenhum item no checklist ainda.</div>`;
  const feitos = arr.filter(i=>i.feito).length;
  const rows = arr.map((i,idx)=>`
    <div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);">
      <input type="checkbox" ${i.feito?'checked':''} onchange="toggleChecklistItem(${idx})" style="width:18px;height:18px;flex:none;">
      <span style="flex:1;font-size:13px;${i.feito?'text-decoration:line-through;color:var(--muted2);':''}">${esc(i.texto)}</span>
      <button type="button" class="btn btn-sm btn-danger" onclick="removeChecklistItem(${idx})">✕</button>
    </div>`).join('');
  return `${rows}<div class="hint" style="margin-top:4px;">${feitos}/${arr.length} concluído(s)</div>`;
}
function addChecklistItem(){
  const inp = document.getElementById('novoChecklistItem');
  const texto = (inp.value||'').trim();
  if(!texto) return;
  window._tarefaChecklist.push({texto, feito:false});
  inp.value='';
  document.getElementById('tarefaChecklistWrap').innerHTML = renderChecklistTarefaBlock();
}
function toggleChecklistItem(idx){
  window._tarefaChecklist[idx].feito = !window._tarefaChecklist[idx].feito;

}
function removeChecklistItem(idx){
  window._tarefaChecklist.splice(idx,1);
  document.getElementById('tarefaChecklistWrap').innerHTML = renderChecklistTarefaBlock();
}
function renderFotosTarefaBlock(tipo){
  const arr = (window._tarefaFotos && window._tarefaFotos[tipo]) || [];
  const thumbs = arr.map((f,idx)=>fotoTileHtml(f, `removeFotoTarefa('${tipo}',${idx})`)).join('');
  return `
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;">${thumbs}</div>
    ${arr.length < 5 ? `<input type="file" accept="image/*" multiple capture="environment" onchange="addFotosTarefa(event,'${tipo}')">` : `<div class="hint">Limite de 5 fotos atingido.</div>`}
    <div class="hint">${arr.length}/5 fotos</div>
    ${arr.length < 5 ? linkAnexoInputHtml('tarefaFotoLink_'+tipo, `addFotoLinkTarefa('${tipo}')`) : ''}
  `;
}
function addFotoLinkTarefa(tipo){
  const inp = document.getElementById('tarefaFotoLink_'+tipo);
  const url = (inp.value||'').trim();
  if(!isValidHttpUrl(url)){ toast('Cole um link válido (começando com http:// ou https://).'); return; }
  window._tarefaFotos[tipo].push({link:url, nome:'Link anexado'});
  refreshFotosTarefaUI(tipo);
}
function addFotosTarefa(e, tipo){
  const arr = window._tarefaFotos[tipo];
  const files = Array.from(e.target.files||[]);
  const vagas = 5 - arr.length;
  if(vagas<=0){ toast('Máximo de 5 fotos.'); e.target.value=''; return; }
  const aceitar = files.slice(0, vagas);
  if(files.length > vagas) toast('Apenas '+vagas+' foto(s) adicionada(s) — limite de 5 por categoria.');
  let pendentes = aceitar.length;
  if(!pendentes){ e.target.value=''; return; }
  aceitar.forEach(file=>{
    if(!/^image\//.test(file.type)){ toast('Envie apenas imagens.'); pendentes--; if(pendentes<=0) refreshFotosTarefaUI(tipo); return; }
    if(file.size > 8*1024*1024){ toast('Imagem muito grande (limite 8MB): '+file.name); pendentes--; if(pendentes<=0) refreshFotosTarefaUI(tipo); return; }
    uploadArquivo(file, 'tarefas').then(url=>{
      arr.push({dataUrl:url, nome:file.name});
      pendentes--;
      if(pendentes<=0) refreshFotosTarefaUI(tipo);
    }).catch(err=>{ console.error(err); toast('⚠️ Falha ao enviar foto: '+file.name); pendentes--; if(pendentes<=0) refreshFotosTarefaUI(tipo); });
  });
  e.target.value='';
}
function removeFotoTarefa(tipo, idx){
  window._tarefaFotos[tipo].splice(idx,1);
  refreshFotosTarefaUI(tipo);
}
function refreshFotosTarefaUI(tipo){
  const wrap = document.getElementById('tarefaFotosWrap_'+tipo);
  if(wrap) wrap.innerHTML = renderFotosTarefaBlock(tipo);
}
function viewFotosTarefa(id){
  const t = DB.tarefas.find(x=>x.id===id);
  if(!t) return;
  const secao = (campo,tipo)=>{
    const arr = t[campo]||[];
    if(!arr.length) return '';
    return `<div style="margin-bottom:14px;">
      <div style="font-weight:700;margin-bottom:6px;">${TAREFA_FOTO_CFG[tipo].label}</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">
        ${arr.map(f=>fotoViewTileHtml(f)).join('')}
      </div>
    </div>`;
  };
  openModal(`
    <div class="modal-head"><h3>Fotos — ${esc(t.titulo)}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    ${secao('fotosAntes','antes')}
    ${secao('fotosDepois','depois')}
    ${!(t.fotosAntes||[]).length && !(t.fotosDepois||[]).length ? '<p class="hint">Nenhuma foto anexada ainda. Edite a tarefa para adicionar.</p>' : ''}
    <div class="btn-row">
      <button type="button" class="btn btn-primary" onclick="openTarefaForm('${id}')">Editar tarefa</button>
      <button type="button" class="btn" onclick="closeModal()">Fechar</button>
    </div>
  `, true);
}
function saveTarefa(e,id){
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target).entries());
  const fotos = window._tarefaFotos || {antes:[],depois:[]};
  data.fotosAntes = fotos.antes; data.fotosDepois = fotos.depois;
  data.checklist = window._tarefaChecklist || [];
  let t;
  if(id){ t = DB.tarefas.find(x=>x.id===id); Object.assign(t, data); }
  else { data.id=uid(); data.obraId=STATE.obraId; data.status=data.status||'a_fazer'; DB.tarefas.push(data); t=data; }
  syncOrigemFromTarefa(t);
  saveDB(); closeModal(); toast('Tarefa salva.'); window._tarefaFotos=null; window._tarefaChecklist=null; go('tarefas');
}
function deleteTarefa(id){
  DB.tarefas = DB.tarefas.filter(t=>t.id!==id);
  saveDB(); closeModal(); toast('Tarefa excluída.'); go('tarefas');
}

}
function saveOrc(e,id){
  e.preventDefault();
  const f = new FormData(e.target);
  const file = f.get('propostaArquivo');
  const data = {categoria:f.get('categoria'), descricao:f.get('descricao'), quantidade:f.get('quantidade'),
    unidade:f.get('unidade'), valorUnit:f.get('valorUnit'), valorTotal:f.get('valorTotal')};
  const fotos = window._orcFotos || {antes:[],depois:[],materiais:[]};
  data.fotosAntes = fotos.antes; data.fotosDepois = fotos.depois; data.fotosMateriais = fotos.materiais;
  const finish = (dataUrl,nome,manteveAnexo)=>{
    if(id){
      const item = DB.orcamentos.find(x=>x.id===id);
      Object.assign(item, data);
      if(!manteveAnexo){ item.propostaDataUrl = dataUrl||''; item.propostaNome = nome||''; }
    } else {
      data.id=uid(); data.obraId=STATE.obraId;
      data.propostaDataUrl = dataUrl||''; data.propostaNome = nome||'';
      DB.orcamentos.push(data);
    }
    saveDB(); closeModal(); toast('Orçamento salvo.'); window._orcFotos=null; go('orcamentos');
  };
  if(file && file.size){
    if(!/^(application\/pdf|image\/)/.test(file.type)){ toast('Envie apenas PDF ou imagem.'); return; }
    if(file.size > 15*1024*1024){ toast('Arquivo muito grande (limite 15MB).'); return; }
    toast('Enviando arquivo…');
    uploadArquivo(file, 'orcamentos').then(url=>finish(url, file.name, false)).catch(err=>{ console.error(err); toast('⚠️ Falha ao enviar arquivo.'); });
  } else {
    finish(null, null, !!id); // ao editar sem novo arquivo, mantém o anexo existente
  }
}
function removerPropostaOrc(id){
  const item = DB.orcamentos.find(x=>x.id===id);
  if(!item) return;
  item.propostaDataUrl = ''; item.propostaNome = '';
  saveDB(); toast('Anexo removido.'); openOrcForm(id);
}
function deleteOrc(id){
  DB.orcamentos = DB.orcamentos.filter(x=>x.id!==id);

}
function toggleOrcExecutado(id){
  const i = DB.orcamentos.find(x=>x.id===id);
  const done = !isItemDone('orcamentos', i);
  setItemDone('orcamentos', id, done);
  syncTarefaFromOrigem('orcamentos', id, done);
  saveDB(); go('orcamentos');
}

function saveProp(e,id){
  e.preventDefault();
  const f = new FormData(e.target);
  const file = f.get('anexoArquivo');
  const data = Object.fromEntries(f.entries());
  delete data.anexoArquivo;
  data.itens = window._propEdit.filter(i=>i.descricao);
  const finish = (dataUrl,nome,manteveAnexo)=>{
    if(id){
      const p = DB.propostas.find(x=>x.id===id);
      Object.assign(p, data);
      if(!manteveAnexo){ p.anexoDataUrl = dataUrl||''; p.anexoNome = nome||''; }
    } else {
      data.id=uid(); data.obraId=STATE.obraId;
      data.anexoDataUrl = dataUrl||''; data.anexoNome = nome||'';
      DB.propostas.push(data);
    }
    saveDB(); closeModal(); toast('Proposta salva.'); go('propostas');
  };
  if(file && file.size){
    if(!/^(application\/pdf|image\/)/.test(file.type)){ toast('Envie apenas PDF ou imagem.'); return; }
    if(file.size > 15*1024*1024){ toast('Arquivo muito grande (limite 15MB).'); return; }
    toast('Enviando arquivo…');
    uploadArquivo(file, 'propostas').then(url=>finish(url, file.name, false)).catch(err=>{ console.error(err); toast('⚠️ Falha ao enviar arquivo.'); });
  } else {
    finish(null, null, !!id); // ao editar sem novo arquivo, mantém o anexo existente
  }
}
function removerAnexoProp(id){
  const p = DB.propostas.find(x=>x.id===id);
  if(!p) return;
  p.anexoDataUrl = ''; p.anexoNome = '';
  saveDB(); toast('Anexo removido.'); openPropForm(id);
}
function deleteProp(id){
  DB.propostas = DB.propostas.filter(x=>x.id!==id);
  saveDB(); closeModal(); toast('Proposta excluída.'); go('propostas');
}

function renderFotosCompraBlock(tipo){
  const arr = (window._compraFotos && window._compraFotos[tipo]) || [];
  const thumbs = arr.map((f,idx)=>fotoTileHtml(f, `removeFotoCompra('${tipo}',${idx})`)).join('');
  return `
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;">${thumbs}</div>
    ${arr.length < 5 ? `<input type="file" accept="image/*" multiple capture="environment" onchange="addFotosCompra(event,'${tipo}')">` : `<div class="hint">Limite de 5 fotos atingido.</div>`}
    <div class="hint">${arr.length}/5 fotos</div>
    ${arr.length < 5 ? linkAnexoInputHtml('compraFotoLink_'+tipo, `addFotoLinkCompra('${tipo}')`) : ''}
  `;
}
function addFotoLinkCompra(tipo){
  const inp = document.getElementById('compraFotoLink_'+tipo);
  const url = (inp.value||'').trim();
  if(!isValidHttpUrl(url)){ toast('Cole um link válido (começando com http:// ou https://).'); return; }
  window._compraFotos[tipo].push({link:url, nome:'Link anexado'});
  refreshFotosCompraUI(tipo);
}
function addFotosCompra(e, tipo){
  const arr = window._compraFotos[tipo];
  const files = Array.from(e.target.files||[]);
  const vagas = 5 - arr.length;
  if(vagas<=0){ toast('Máximo de 5 fotos.'); e.target.value=''; return; }
  const aceitar = files.slice(0, vagas);
  if(files.length > vagas) toast('Apenas '+vagas+' foto(s) adicionada(s) — limite de 5.');
  let pendentes = aceitar.length;
  if(!pendentes){ e.target.value=''; return; }
  aceitar.forEach(file=>{
    if(!/^image\//.test(file.type)){ toast('Envie apenas imagens.'); pendentes--; if(pendentes<=0) refreshFotosCompraUI(tipo); return; }
    if(file.size > 8*1024*1024){ toast('Imagem muito grande (limite 8MB): '+file.name); pendentes--; if(pendentes<=0) refreshFotosCompraUI(tipo); return; }
    uploadArquivo(file, 'compras').then(url=>{
      arr.push({dataUrl:url, nome:file.name});
      pendentes--;
      if(pendentes<=0) refreshFotosCompraUI(tipo);
    }).catch(err=>{ console.error(err); toast('⚠️ Falha ao enviar foto: '+file.name); pendentes--; if(pendentes<=0) refreshFotosCompraUI(tipo); });
  });
  e.target.value='';
}
function removeFotoCompra(tipo, idx){
  window._compraFotos[tipo].splice(idx,1);
  refreshFotosCompraUI(tipo);
}
function refreshFotosCompraUI(tipo){
  const wrap = document.getElementById('compraFotosWrap_'+tipo);
  if(wrap) wrap.innerHTML = renderFotosCompraBlock(tipo);
}
function viewFotosCompra(id){
  const c = DB.compras.find(x=>x.id===id);
  if(!c) return;
  const arr = c.fotos||[];
  openModal(`
    <div class="modal-head"><h3>Fotos — ${esc(c.item)}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    ${arr.length?`<div style="display:flex;flex-wrap:wrap;gap:8px;">${arr.map(f=>fotoViewTileHtml(f)).join('')}</div>`:'<p class="hint">Nenhuma foto anexada ainda.</p>'}
    <div class="btn-row" style="margin-top:12px;">
      <button type="button" class="btn btn-primary" onclick="openCompraForm('${id}')">Editar item</button>
      <button type="button" class="btn" onclick="closeModal()">Fechar</button>
    </div>
  `, true);
}
function saveCompra(e,id){
  e.preventDefault();
  const fd = new FormData(e.target);
  const data = Object.fromEntries(fd.entries());
  data.tarefasUso = fd.getAll('tarefasUso');
  const fotos = window._compraFotos || {material:[]};
  data.fotos = fotos.material;
  if(id) Object.assign(DB.compras.find(x=>x.id===id), data);
  else { data.id=uid(); data.obraId=STATE.obraId; DB.compras.push(data); }
  const finalId = id || data.id;
  syncTarefaFromOrigem('compras', finalId, data.status==='comprado');
  saveDB(); closeModal(); toast('Item salvo.'); window._compraFotos=null; go('compras');
}
function toggleCompra(id){
  const c = DB.compras.find(x=>x.id===id);
  c.status = c.status==='comprado' ? 'pendente' : 'comprado';
  c.dataCompra = c.status==='comprado' ? nowISO() : '';
  syncTarefaFromOrigem('compras', id, c.status==='comprado');
  saveDB(); go('compras');
}
function deleteCompra(id){
  DB.compras = DB.compras.filter(x=>x.id!==id);
  saveDB(); closeModal(); toast('Item removido.'); go('compras');
}

/* ── Comprovante genérico (recibo/nota/foto), reaproveitado nas 3 abas ── */
function renderComprovanteBlock(key){
  window._comprovantes = window._comprovantes||{};
  const c = window._comprovantes[key];
  if(c && (c.dataUrl || c.link)){
    const isImg = /^image\//.test(c.tipo||'') || /\.(png|jpe?g|gif|webp)$/i.test(c.nome||'');
    const thumb = c.dataUrl || driveThumbUrl(c.link);
    const openUrl = c.dataUrl || c.link;
    return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
      ${isImg && thumb ? `<img src="${thumb}" style="width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--border);cursor:pointer;" onclick="window.open('${openUrl}','_blank')">` : `<a href="${openUrl}" target="_blank" rel="noopener" class="btn btn-sm">📎 ${esc(c.nome||(c.link?'link anexado':'arquivo'))}</a>`}
      <button type="button" class="btn btn-sm btn-danger" onclick="removeComprovante('${key}')">Remover</button>
    </div>`;
  }
  return `<input type="file" accept="application/pdf,image/*" capture="environment" onchange="pickComprovante(event,'${key}')">
    ${linkAnexoInputHtml('comprovanteLink_'+key, `addLinkComprovante('${key}')`)}`;
}
function pickComprovante(e,key){
  const file = e.target.files[0];
  if(!file) return;
  if(!/^(application\/pdf|image\/)/.test(file.type)){ toast('Envie apenas PDF ou imagem.'); e.target.value=''; return; }
  if(file.size > 15*1024*1024){ toast('Arquivo muito grande (limite 15MB).'); e.target.value=''; return; }
  uploadArquivo(file, 'comprovantes').then(url=>{
    window._comprovantes[key] = {dataUrl:url, nome:file.name, tipo:file.type};
    refreshComprovanteUI(key);
  }).catch(err=>{ console.error(err); toast('⚠️ Falha ao enviar arquivo.'); });
}
function addLinkComprovante(key){
  const inp = document.getElementById('comprovanteLink_'+key);
  const url = (inp.value||'').trim();
  if(!isValidHttpUrl(url)){ toast('Cole um link válido (começando com http:// ou https://).'); return; }
  window._comprovantes[key] = {link:url, nome:'Link anexado'};
  refreshComprovanteUI(key);
}
function removeComprovante(key){ window._comprovantes[key]=null; refreshComprovanteUI(key); }
function refreshComprovanteUI(key){
  const wrap = document.getElementById(COMPROVANTE_WRAP[key]);
  if(wrap) wrap.innerHTML = renderComprovanteBlock(key);
}

function calcSugestaoDiaria(){
  const sel = document.querySelector('select[name="pessoaId"]');
  const pessoaId = sel ? sel.value : '';
  if(!pessoaId){ toast('Selecione a pessoa primeiro.'); return; }
  const pessoa = DB.rhPessoas.find(p=>p.id===pessoaId);
  if(pessoa && pessoa.tipoContratacao==='empreita'){
    document.getElementById('pagValor').value = Number(pessoa.valorEmpreita)||0;
    toast('Esta pessoa é contratada por empreita — preenchido com o valor combinado cadastrado em RH & Equipe. Ajuste se for pagamento parcial.');
    return;
  }
  const ini = document.getElementById('pagRefIni').value;
  const fim = document.getElementById('pagRefFim').value;
  const regs = DB.presencas.filter(r=>r.obraId===STATE.obraId && r.pessoaId===pessoaId &&
    (!ini || r.data>=ini) && (!fim || r.data<=fim));
  const total = regs.reduce((s,r)=>s+(Number(r.custoNormal)||0)+(Number(r.custoExtra)||0),0);
  document.getElementById('pagValor').value = total.toFixed(2);
  toast(total ? `Sugestão calculada: ${fmtMoney(total)} (${regs.length} registro(s) de presença).` : 'Nenhum registro de presença encontrado no período.');
}
function savePagDiaria(e,id){
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target).entries());
  data.comprovante = (window._comprovantes||{}).diaria || null;
  if(id) Object.assign(DB.pagamentosDiarias.find(x=>x.id===id), data);
  else { data.id=uid(); data.obraId=STATE.obraId; DB.pagamentosDiarias.push(data); }
  saveDB(); closeModal(); toast('Pagamento salvo.'); go('pagamentos');
}
function togglePagDiaria(id){

   equipe (ou terceiro) e que precisam ser devolvidas. Exige

   de salvar, para dar respaldo ao pagamento.
   ============================================================ */
const CATEGORIA_REEMBOLSO = ['Material','Transporte/Combustível','Alimentação','Ferramenta','Estacionamento/Pedágio','Outro'];
const STATUS_REEMBOLSO = {pendente:['Pendente','muted'], aprovado:['Aprovado','blue'], pago:['Reembolsado','green'], recusado:['Recusado','red']};
function renderReembolsos(){
  return requireObra(()=>{
    const itens = DB.reembolsos.filter(x=>x.obraId===STATE.obraId).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
    const totalPendente = itens.filter(x=>x.status==='pendente'||x.status==='aprovado').reduce((s,x)=>s+(Number(x.valor)||0),0);
    const totalPago = itens.filter(x=>x.status==='pago').reduce((s,x)=>s+(Number(x.valor)||0),0);
    const rows = itens.map(x=>{
      const st = STATUS_REEMBOLSO[x.status]||STATUS_REEMBOLSO.pendente;
      const anexo = x.anexo && (x.anexo.dataUrl||x.anexo.link);
      return `<tr>
        <td>${fmtDate(x.data)}</td>
        <td>${esc(x.solicitante||'—')}</td>
        <td>${esc(x.descricao||'—')}${x.categoria?`<br><span class="badge badge-blue">${esc(x.categoria)}</span>`:''}</td>
        <td>${fmtMoney(x.valor)}</td>
        <td><span class="badge badge-${st[1]}">${st[0]}</span></td>
        <td class="row-actions">
          ${anexo?`<button class="btn btn-sm" title="Ver nota anexada" onclick="window.open('${x.anexo.dataUrl||x.anexo.link}','_blank')">🧾</button>`:''}
          ${x.status!=='pago'?`<button class="btn btn-sm" onclick="avancarStatusReembolso('${x.id}')">${x.status==='pendente'?'Aprovar':'Marcar reembolsado'}</button>`:''}
          ${x.status!=='recusado'&&x.status!=='pago'?`<button class="btn btn-sm" onclick="recusarReembolso('${x.id}')">Recusar</button>`:''}
          <button class="btn btn-sm" onclick="openReembolsoForm('${x.id}')">Editar</button>
          <button class="btn btn-sm btn-danger" onclick="deleteReembolso('${x.id}')">✕</button>
        </td>
      </tr>`;
    }).join('');
    return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
        <div class="card-title" style="margin:0;">Reembolsos — ${esc(currentObra().nome)}</div>
        <button class="btn btn-primary btn-sm" onclick="openReembolsoForm()">+ Novo reembolso</button>
      </div>
      <div class="grid grid-2" style="margin-bottom:12px;">
        <div class="stat accent-gold"><div class="n">${fmtMoney(totalPendente)}</div><div class="l">Pendente/aprovado</div></div>
        <div class="stat accent-green"><div class="n">${fmtMoney(totalPago)}</div><div class="l">Já reembolsado</div></div>
      </div>
      ${itens.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Data</th><th>Solicitante</th><th>Descrição</th><th>Valor</th><th>Status</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table></div>` : `<div class="empty-state"><div class="big">🧾</div><p>Nenhum reembolso lançado ainda.</p></div>`}
    </div>`;
  });
}

      </div>
    </form>
  `, true);
}
function saveReembolso(e,id){
  e.preventDefault();
  const anexo = (window._comprovantes||{}).reembolso;
  if(!anexo || !(anexo.dataUrl || anexo.link)){
    toast('⚠️ Anexe uma foto, PDF ou link da nota antes de salvar o reembolso.');
    return;
  }
  const data = Object.fromEntries(new FormData(e.target).entries());
  data.anexo = anexo;
  if(id) Object.assign(DB.reembolsos.find(x=>x.id===id), data);
  else { data.id=uid(); data.obraId=STATE.obraId; DB.reembolsos.push(data); }
  saveDB(); closeModal(); toast('Reembolso salvo.'); window._comprovantes.reembolso=null; go('reembolsos');
}
function avancarStatusReembolso(id){
  const x = DB.reembolsos.find(y=>y.id===id);
  if(!x) return;
  x.status = x.status==='pendente' ? 'aprovado' : 'pago';
  saveDB(); toast('Status atualizado.'); go('reembolsos');
}
function recusarReembolso(id){
  const x = DB.reembolsos.find(y=>y.id===id);
  if(!x) return;
  x.status='recusado'; saveDB(); toast('Reembolso recusado.'); go('reembolsos');
}
function deleteReembolso(id){
  if(!confirm('Excluir este reembolso?')) return;
  DB.reembolsos = DB.reembolsos.filter(x=>x.id!==id);
  saveDB(); closeModal(); toast('Reembolso removido.'); go('reembolsos');
}
